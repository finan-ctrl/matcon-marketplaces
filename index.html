<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MATCON.casa · Gestão de Marketplaces</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23111'/><text x='16' y='22' font-family='Arial' font-weight='900' font-size='15' text-anchor='middle' fill='%2394BF26'>MC</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --brand:#94BF26; --brand-d:#6f9214; --brand-l:#eef5da;
  --ink:#111111; --ink-2:#52514e; --ink-3:#8a8984;
  --bg:#f4f5f1; --card:#ffffff; --line:#e6e6e1; --line-2:#f0f0ec;
  --st-inativar:#e34948; --st-dif:#eda100; --st-igual:#008300; --st-subir:#2a78d6; --st-none:#a3a29c;
  --radius:12px; --shadow:0 1px 2px rgba(17,17,17,.04),0 2px 8px rgba(17,17,17,.04);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,sans-serif;overflow-x:hidden}
h1,h2,h3{font-family:Montserrat,Inter,sans-serif;margin:0}
button,input,select{font:inherit}
.hidden{display:none!important}

/* ---------- header ---------- */
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.hbar{display:flex;align-items:center;gap:20px;padding:12px 24px;max-width:100%}
.hbar img{height:26px;display:block}
.hbar .tag{font:600 11px Inter;color:var(--ink-2);border-left:1px solid var(--line);padding-left:14px;text-transform:uppercase;letter-spacing:.08em}
.hbar .sp{flex:1}
.hbar .who{font-size:12px;color:var(--ink-2);text-align:right;overflow-wrap:anywhere}
nav{display:flex;gap:2px;padding:0 24px;flex-wrap:wrap}
nav button{background:none;border:0;padding:10px 14px 12px;color:var(--ink-2);font-weight:600;cursor:pointer;border-bottom:3px solid transparent}
nav button:hover{color:var(--ink)}
nav button.on{color:var(--ink);border-bottom-color:var(--brand)}
.banner{background:#fff8e1;border-bottom:1px solid #f1e2b0;color:#6b5300;padding:8px 24px;font-size:13px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}

main{padding:20px 24px 48px;max-width:1840px;margin:0 auto}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.page-h h1{font-size:22px;font-weight:800}
.page-h p{margin:4px 0 0;color:var(--ink-2);font-size:13px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:7px 12px;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#cfcfc8}
.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.pri:hover{background:#2a2a2a}
.btn.lime{background:var(--brand);border-color:var(--brand);color:#111}
.btn.sm{padding:5px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ---------- grid / cards ---------- */
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.span2{grid-column:span 2}
@media(max-width:1100px){.g4,.g5{grid-template-columns:repeat(2,minmax(0,1fr))}.g3,.g2{grid-template-columns:minmax(0,1fr)}.span2{grid-column:auto}}
@media(max-width:560px){.g4,.g5{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;min-width:0}
.card h3{font-size:14px;font-weight:700;margin-bottom:2px}
.card .sub{color:var(--ink-3);font-size:12px;margin-bottom:12px}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}

.kpi{position:relative;overflow:hidden}
.kpi .lb{font-size:12px;color:var(--ink-2);font-weight:600}
.kpi .v{font:800 28px/1.15 Montserrat;margin-top:6px;letter-spacing:-.01em}
.kpi .d{font-size:12px;color:var(--ink-3);margin-top:4px}
.kpi.accent::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--brand)}
.kpi.click{cursor:pointer;transition:border-color .15s}
.kpi.click:hover{border-color:#cfcfc8}
.kpi.sel{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.kpi .dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:0}

/* ---------- tables (sem rolagem lateral) ---------- */
.tbl{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13px}
.tbl th{font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-2);font-weight:700;text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:normal;line-height:1.25;vertical-align:bottom;overflow-wrap:normal;hyphens:none;user-select:none}
.tbl th.s{cursor:pointer}
.tbl th.s:hover{color:var(--ink)}
.tbl td{padding:7px 6px;border-bottom:1px solid var(--line-2);white-space:normal;overflow-wrap:anywhere;line-height:1.35;vertical-align:middle}
.tbl td.n{overflow-wrap:normal;white-space:nowrap}
@media(max-width:1300px){.tbl td,.tbl th{padding-left:4px;padding-right:4px}.tbl td.n{font-size:12px}.tbl th{font-size:10px}}
.tbl tr:hover td{background:#fafaf7}
.tbl .n{text-align:right;font-variant-numeric:tabular-nums}
.tbl .c{text-align:center}
.tbl tfoot td{font-weight:700;border-top:1px solid var(--line);border-bottom:0}
.tbl td.wrap{white-space:normal}
.tbl.hw th{white-space:normal;line-height:1.25;vertical-align:bottom}
@media(max-width:1200px){.tbl .hm{display:none}}
@media(max-width:1500px){.tbl .hl{display:none}}
@media(max-width:1750px){.tbl .hxl{display:none}}
.gk{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.sec-t{font:700 12px Inter;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin:0 0 8px}
.gk .kpi .v{font-size:24px}
.sit{font-size:12px;color:var(--ink-2);line-height:1.3}
@media(max-width:900px){.tbl .hs{display:none}}
@media(max-width:640px){.tbl .hx{display:none}}
.lnk{color:inherit;text-decoration:underline dotted #b5b4ad;text-underline-offset:3px;cursor:pointer;border-radius:4px;padding:1px 3px;margin:-1px -3px}
.lnk:hover{color:var(--brand-d);text-decoration-color:var(--brand-d);background:var(--brand-l)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.muted{color:var(--ink-3)}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:10px;background:#f1f1ed;color:var(--ink-2);max-width:100%;line-height:1.3}
.pill::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--st-none);flex:none}
.pill.Inativar{background:#fdeceb;color:#a32221}.pill.Inativar::before{background:var(--st-inativar)}
.pill.Dif{background:#fdf3dc;color:#7a5300}.pill.Dif::before{background:var(--st-dif)}
.pill.Igual{background:#e3f2e3;color:#005c00}.pill.Igual::before{background:var(--st-igual)}
.pill.Subir{background:#e3eefb;color:#1c4f8f}.pill.Subir::before{background:var(--st-subir)}
.pill.Ativar{background:#ecebfb;color:#3b2fa0}.pill.Ativar::before{background:#6250d6}
.pill.Manter{background:#e2f5ee;color:#0d6b4a}.pill.Manter::before{background:#1baf7a}
.pp{display:inline;font-size:11.5px;font-weight:600;color:var(--ink-2);line-height:1.35}
.pp i{margin-right:5px;vertical-align:1px}
.pp i{width:8px;height:8px;border-radius:50%;display:inline-block}
.errb{display:inline-block;font-size:10.5px;font-weight:700;color:#a32221;background:#fdeceb;border-radius:4px;padding:0 5px;margin-left:4px;cursor:help}
.chipc{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;margin:1px 3px 1px 0;line-height:1.4;white-space:nowrap}
.ico{width:22px;height:22px;border-radius:5px;vertical-align:middle;object-fit:cover;box-shadow:0 0 0 1px rgba(17,17,17,.08);margin:1px 4px 1px 0;image-rendering:auto}
.ico.sm{width:18px;height:18px;margin:0 7px 0 0;vertical-align:-4px}
.ico.lg{width:28px;height:28px;margin:0 10px 0 0;vertical-align:-5px;border-radius:7px}
.chipc.meli{background:#FFE600;color:#2D3277}
.chipc.shopee{background:#EE4D2D;color:#fff}
.chipc.magalu{background:#0086FF;color:#fff}
.pill.ok{background:var(--brand-l);color:#476000}.pill.ok::before{background:var(--brand)}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters select:disabled{opacity:.45;cursor:not-allowed}
.filters input[type=search],.filters select{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff;min-width:0}
.filters input[type=search]{flex:1 1 200px;min-width:190px}
.filters select{flex:0 0 auto;max-width:100%}
.filters label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.pager{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12px;color:var(--ink-2);gap:8px;flex-wrap:wrap}
.pager .pg{display:flex;gap:4px;align-items:center}

.chart-box{position:relative;height:260px}
.chart-box.sm{height:200px}
.chart-box.lg{height:320px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-bottom:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.empty{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;color:var(--ink-3);text-align:center;padding:28px 12px;font-size:13px}
.empty b{color:var(--ink-2)}

/* bar list (motivos) */
.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:12.5px}
.bar-row .nm{color:var(--ink-2);line-height:1.25}
.bar-row .tr{height:12px;background:var(--line-2);border-radius:4px;overflow:hidden}
.bar-row .fl{height:100%;background:var(--ink);border-radius:0 4px 4px 0}
.bar-row .vl{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}

/* upload */
.drop{border:2px dashed #cfd6bd;border-radius:var(--radius);background:#fbfcf6;padding:32px 16px;text-align:center;cursor:pointer;transition:.15s}
.drop:hover,.drop.over{border-color:var(--brand);background:var(--brand-l)}
.drop .big{font:700 16px Montserrat;margin-bottom:4px}
.progress{height:8px;background:var(--line-2);border-radius:99px;overflow:hidden;margin-top:10px}
.progress>div{height:100%;width:0;background:var(--brand);transition:width .2s}

/* premissas */
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.fld label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:4px}
.fld input,.fld select{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff}
.fld .hint{font-size:11px;color:var(--ink-3);margin-top:3px}
.tbl input.cell{width:100%;border:1px solid transparent;border-radius:6px;padding:4px 5px;text-align:right;background:#fafaf7;font-variant-numeric:tabular-nums;font-size:12px;min-width:0}
.tbl input.cell:focus{border-color:var(--brand);outline:none;background:#fff}
.tbl.dense td{padding:3px 3px}.tbl.dense th{padding:6px 3px;font-size:10px;white-space:normal;line-height:1.2}

/* modal / login / toast */
.overlay{position:fixed;inset:0;background:rgba(17,17,17,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:460px;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.modal h2{font-size:18px;margin-bottom:6px}
.modal p{color:var(--ink-2);font-size:13px;margin:0 0 16px}
.modal .fld{margin-bottom:12px}
.modal .act{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(135deg,#f4f5f1 0%,#eef5da 100%)}
.login .modal{max-width:380px}
.login img{height:34px;margin-bottom:18px}
.err{color:#a32221;font-size:12.5px;min-height:18px}
#toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:60;opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none;max-width:calc(100vw - 40px)}
#toast.on{opacity:1;transform:none}
.loading{position:fixed;inset:0;background:rgba(244,245,241,.85);display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;z-index:55;font-weight:600}
.spin{width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.chk{width:16px;height:16px;accent-color:var(--brand-d);cursor:pointer;margin:0}
.note{font-size:12px;color:var(--ink-2);background:var(--line-2);border-radius:8px;padding:10px 12px;line-height:1.5}
</style>
</head>

function mpFromAnymarket(nome){
  const n = String(nome||'').trim().toLowerCase();
  const m = MARKETPLACES.find(mp => mp.any.some(a => n === a)) || MARKETPLACES.find(mp => mp.any.some(a => n.includes(a)));
  return m ? m.id : (n || 'outro');
}

/* ---------- normalização ---------- */
function num(v){
  if (v === null || v === undefined || v === '') return null;
  if (typeof v === 'number') return isFinite(v) ? v : null;
  let s = String(v).trim();
  if (!s) return null;
  if (s.includes(',')) s = s.replace(/\./g,'').replace(',','.'); // 1.234,56 (pt-BR)
  // sem vírgula: ponto é decimal (padrão do export: 0.650000)
  const n = parseFloat(s);
  return isFinite(n) ? n : null;
}
function txt(v){ return v===null||v===undefined ? '' : String(v).trim(); }
function decodeHtml(s){
  return String(s||'').replace(/&quot;/g,'"').replace(/&#0?39;/g,"'").replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>');
}
const r2 = v => Math.round(v*100)/100;

function corrigePeso(v){
  const n = num(v);
  if (n === null) return null;
  return n >= 1000 ? n / 1000000 : n;
}

/* Linha bruta da base (Produtos Base - BI) -> produto normalizado */
function normalizaProduto(row, P){
  const g = k => { for (const key of Object.keys(row)) if (key.trim().toLowerCase() === k) return row[key]; return null; };
  const preco = num(g('price')), esp = num(g('special_price')), est = num(g('stock_quantity'));
  return {
    sku: txt(g('sku')),
    name: decodeHtml(txt(g('name'))),
    ean: txt(g('ean')),
    marca: txt(g('marca')).toUpperCase(),
    departamento: txt(g('departamento')),
    categoria: txt(g('categoria')),
    subcategoria: txt(g('subcategoria')),
    inflamavel: txt(g('inflamavel')),
    altura: num(g('altura')),
    largura: num(g('largura')),
    profundidade: num(g('profundidade')),
    peso: corrigePeso(g('peso')),
    price: preco===null ? null : r2(preco / P.div_preco),
    special_price: esp===null ? null : r2(esp / P.div_preco),
    status: txt(g('status')),
    stock: est===null ? null : est / P.div_estoque,
    seller_id: txt(g('seller_id'))
  };
}

/* Linha do export de Anúncios do Anymarket (um arquivo por marketplace) */
function normalizaPublicacao(row){

/* ---------- regras ---------- */
/* Preço de venda no site = Preço Por (special_price); sem ele, Preço De (price) */
function precoRef(p){ return (p.special_price && p.special_price > 0) ? p.special_price : (p.price || 0); }

function elegibilidade(p, P){
  const motivos = [];
  if (txt(p.seller_id) !== txt(P.seller_id)) motivos.push('Outro seller');
  if (p.status.toLowerCase() !== 'habilitado') motivos.push('Desabilitado');
  if (p.inflamavel.toLowerCase() === 'sim') motivos.push('Inflamável');
  if (precoRef(p) <= 0) motivos.push('Sem preço');
  if ((p.peso||0) >= P.peso_max) motivos.push('Peso ≥ ' + P.peso_max + ' kg');
  if ([p.altura,p.largura,p.profundidade].some(d => (d||0) >= P.dim_max)) motivos.push('Dimensão ≥ ' + P.dim_max + ' cm');
  const incompleto = [p.peso,p.altura,p.largura,p.profundidade].some(v => v===null || v===0);
  if (incompleto && P.exigir_cadastro) motivos.push('Cadastro incompleto');
  return { elegivel: motivos.length === 0, motivos, incompleto };
}

function custoShopee(preco, P){
  const f = P.shopee.faixas.slice().sort((a,b)=>a.min-b.min);
  let t = f[0];
  for (const x of f) if (preco >= x.min) t = x;
  return { frete: null, fixo: t.fixo, com: t.com, pct: (t.com*preco + t.fixo)/preco };
}
/* ---------- tabelas de frete com vigência ----------
   Cada canal pode ter "historico": [{vigencia:'AAAA-MM-DD', arquivo, carregado_em, usuario, ...tabela}].
   Vale a de maior vigência que já começou; sem nenhuma, vale a tabela base das premissas. */
function hojeISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function tabelaVigente(obj, hoje){
  hoje = hoje || hojeISO();
  const h = (obj && obj.historico || []).filter(x => x.vigencia <= hoje).sort((a,b) => a.vigencia < b.vigencia ? 1 : a.vigencia > b.vigencia ? -1 : (a.carregado_em < b.carregado_em ? 1 : -1));
  return h[0] || obj;
}

/* Lê uma planilha de frete (linhas = faixas de peso; colunas = faixas de preço ou valores) */
function pesoLimite(label){
  const t = String(label||'').toLowerCase().replace(/\s+/g,' ');
  if (/mais de|acima de|a partir de/.test(t)) return 1e9;
  const re = /(\d+(?:[.,]\d+)?)\s*(kg|gr|g)?/g; let m, last=null, unit=null;
  while ((m = re.exec(t))){ last = parseFloat(m[1].replace(',','.')); if (m[2]) unit = m[2]; }
  if (last === null) return null;
  if (!unit && /gr?\b/.test(t) && !/kg/.test(t)) unit = 'g';
  return (unit === 'g' || unit === 'gr') ? last/1000 : last;
}
function precoInicio(label){
  const m = String(label||'').replace(/\./g,'').match(/(\d+(?:,\d+)?)/);
  return m ? parseFloat(m[1].replace(',','.')) : 0;
}
function lerTabelaFrete(aoa){
  let hi = aoa.findIndex(r => r && /peso/i.test(String(r[0]||'')));
  if (hi < 0) hi = 0;
  const header = (aoa[hi]||[]).slice(1).map(x => String(x??'').trim());
  const cols = header.map((h,i)=>({h,i})).filter(c => c.h);
  const linhas = [];
  for (const r of aoa.slice(hi+1)){
    if (!r || r[0]==null || String(r[0]).trim()==='') continue;
    const lim = pesoLimite(r[0]);
    if (lim === null) continue;
    const vals = cols.map(c => { const v = r[c.i+1]; const n = typeof v==='number' ? v : parseFloat(String(v??'').replace(/[^\d,.-]/g,'').replace(/\./g,'').replace(',','.')); return isFinite(n) ? n : null; });
    if (vals.every(v => v === null)) continue;
    linhas.push({ label:String(r[0]).trim(), lim, vals });
  }
  linhas.sort((a,b)=>a.lim-b.lim);
  return { colunas: cols.map(c=>c.h), faixas_peso: linhas.map(l=>l.lim), rotulos: linhas.map(l=>l.label), matriz: linhas.map(l=>l.vals) };
}

function freteMeli(preco, peso, P){
  const M = { ...P.meli, ...tabelaVigente(P.meli) };
  if ((peso||0) > M.faixas_peso[M.faixas_peso.length-1]) return null;
  let col = 0; for (const lim of M.faixas_preco) if (preco > lim) col++;
  let lin = M.faixas_peso.findIndex(l => (peso||0) <= l);
  if (lin < 0) return null;
  const v = (M.tabela[lin]||[])[col];
  return v==null ? null : r2(v * M.multiplicador);
}
function custoMeli(preco, peso, P){
  const frete = freteMeli(preco, peso, P);
  return { frete, fixo: 0, com: P.meli.com, pct: frete===null ? null : (P.meli.com*preco + frete)/preco };
}
function freteMagalu(peso, P){
  const M = { ...P.magalu, ...tabelaVigente(P.magalu) };
  const i = M.faixas_peso.findIndex(l => (peso||0) <= l);
  return i < 0 ? null : M.valores[i];
}
function custoMagalu(preco, peso, P){
  const frete = freteMagalu(peso, P);
  return { frete, fixo: 0, com: P.magalu.com, pct: frete===null ? null : (P.magalu.com*preco + frete)/preco };
}

/* publicado = anúncio Ativo no canal; cadastrado = existe anúncio (qualquer status) */
function statusMP(eleg, pct, P, cad, publicado, precoCanal, preco){
  const viavel = eleg && pct !== null && pct <= P.comissao_max;
  if (publicado){
    if (!viavel) return 'Inativar';
    if (precoCanal !== null && precoCanal > 0) return r2(precoCanal) === r2(preco) ? 'Igual' : 'Dif';
    return 'Manter';
  }
  if (cad) return viavel ? 'Ativar' : '';
  return viavel ? 'Subir' : '';
}

function custoExtra(id, preco, peso, P){
  const c0 = canalExtra(P, id) || {}; const c = { ...c0, ...tabelaVigente(c0) };
  const fp = (c.faixas_peso||[]).map(Number), vs = (c.valores||[]).map(Number);
  let frete = 0;
  if (fp.length){ const i = fp.findIndex(l => (peso||0) <= l); frete = i < 0 ? null : (vs[i] ?? 0); }
  const com = Number(c.com)||0, fixo = Number(c.fixo)||0;
  return { frete, fixo, com, pct: frete===null ? null : (com*preco + fixo + frete)/preco };
}
function custoCanal(id, preco, peso, P){
  if (id==='shopee') return custoShopee(preco, P);
  if (id==='meli')   return custoMeli(preco, peso, P);
  if (id==='magalu') return custoMagalu(preco, peso, P);
  return custoExtra(id, preco, peso, P);
}

/* ---------- cálculo completo ---------- */
function agregaPublicacoes(publicacoes){
  const agg = {}, mps = new Set(), outros = {};
  for (const a of publicacoes||[]){
    const mp = mpFromAnymarket(a.marketplace);
    if (!MARKETPLACES.some(m=>m.id===mp)) { (outros[a.marketplace] ||= new Set()).add(a.sku); continue; }
    mps.add(mp);
    const k = mp + '|' + a.sku;
    const x = agg[k] ||= { sku:a.sku, n:0, pub:null, erro:false, erros:[], estoque:null, codigos:[], tipos:[], links:[], titulo:a.titulo, status_marketplace:a.status_marketplace };
    x.n++;
    const ia = PUB_ORDEM.indexOf(a.status_publicacao), ib = PUB_ORDEM.indexOf(x.pub);
    if (x.pub === null || (ia >= 0 && (ib < 0 || ia < ib))) { x.pub = a.status_publicacao; x.status_marketplace = a.status_marketplace; }
    if (/erro/i.test(a.status_transmissao)) { x.erro = true; if (a.erro && !x.erros.includes(a.erro)) x.erros.push(a.erro); }
    if (a.estoque !== null) x.estoque = Math.max(x.estoque ?? 0, a.estoque);
    if (a.codigo) x.codigos.push(a.codigo);
    if (a.tipo_listagem && !x.tipos.includes(a.tipo_listagem)) x.tipos.push(a.tipo_listagem);
    if (a.link) x.links.push(a.link);
  }
  return { agg, mps, outros };
}

function calcula(produtos, anuncios, publicacoes, P){
  if (P === undefined && !Array.isArray(publicacoes)) { P = publicacoes; publicacoes = []; }
  setCanais(P);
  // preço no canal (export de preços, opcional) — menor PREÇO POR quando houver duplicidade
  const precos = {}; const outros = {};
  for (const a of anuncios||[]){
    const mp = mpFromAnymarket(a.marketplace);
    const preco = a.preco_por ?? a.preco_de;
    if (!MARKETPLACES.some(m=>m.id===mp)) { (outros[a.marketplace] ||= new Set()).add(a.sku); continue; }
    const key = mp + '|' + a.sku;
    if (!(key in precos) || (preco !== null && preco < precos[key])) precos[key] = preco;
  }
  const PUB = agregaPublicacoes(publicacoes);
  for (const [k,v] of Object.entries(PUB.outros)) { outros[k] ||= new Set(); v.forEach(x=>outros[k].add(x)); }
  const info = (mp, sku) => {
    const precoCanal = precos[mp+'|'+sku] ?? null;
    if (PUB.mps.has(mp)){ const pi = PUB.agg[mp+'|'+sku] || null; return { pi, precoCanal, cad: !!pi, publicado: !!pi && pi.pub === 'Ativo' }; }
    const tem = precoCanal !== null && precoCanal > 0;   // sem export de anúncios: usa o de preços
    return { pi:null, precoCanal, cad: tem, publicado: tem };
  };
  const catalogo = new Set();
  const linhas = [];
  for (const p of produtos){
    if (!p.sku) continue;
    if (txt(p.seller_id) !== txt(P.seller_id)) continue; // universo = Flagship
    catalogo.add(p.sku);
    const e = elegibilidade(p, P);
    const preco = precoRef(p);
    const L = { ...p, preco_ref: preco, elegivel: e.elegivel, motivos: e.motivos, incompleto: e.incompleto, mp: {} };
    for (const m of MARKETPLACES){
      const c = e.elegivel ? custoCanal(m.id, preco, p.peso, P) : null;
      const I = info(m.id, p.sku);
      L.mp[m.id] = {
        ativo: I.precoCanal, cad: I.cad, publicado: I.publicado,
        pub: I.pi ? I.pi.pub : (I.cad ? 'Ativo' : null), erro: I.pi ? I.pi.erro : false, erros: I.pi ? I.pi.erros : [],
        estoque_canal: I.pi ? I.pi.estoque : null, n: I.pi ? I.pi.n : (I.cad?1:0), codigos: I.pi ? I.pi.codigos : [], tipos: I.pi ? I.pi.tipos : [], links: I.pi ? I.pi.links : [],
        frete: c?c.frete:null, com: c?c.com:null, fixo: c?c.fixo:null, pct: c?c.pct:null,
        comissao: c ? r2(c.com * preco) : null,
        status: statusMP(e.elegivel, c?c.pct:null, P, I.cad, I.publicado, I.precoCanal, preco)
      };
    }
    linhas.push(L);
  }
  // anúncios cujo SKU não está no catálogo Flagship (publicado => Inativar)
  const orfaos = {};
  const vistos = new Set();
  const addOrfao = (mp, sku) => {
    const k = mp+'|'+sku; if (vistos.has(k) || catalogo.has(sku)) return; vistos.add(k);
    const I = info(mp, sku);
    (orfaos[mp] ||= []).push({ sku, ativo: I.precoCanal, cad: I.cad, publicado: I.publicado, pub: I.pi ? I.pi.pub : (I.cad?'Ativo':null), erro: I.pi?I.pi.erro:false, erros: I.pi?I.pi.erros:[], estoque_canal: I.pi?I.pi.estoque:null, titulo: I.pi?I.pi.titulo:'', status: I.publicado ? 'Inativar' : '' });
  };
  Object.keys(PUB.agg).forEach(k => { const [mp, ...r] = k.split('|'); addOrfao(mp, r.join('|')); });
  Object.keys(precos).forEach(k => { const [mp, ...r] = k.split('|'); if (!PUB.mps.has(mp)) addOrfao(mp, r.join('|')); });
  return { linhas, orfaos, outros, comPublicacoes: [...PUB.mps] };
}

function resumo(res){
  const flag = res.linhas.filter(l => l.status.toLowerCase()==='habilitado').length;
  const out = { flagship: flag, total: res.linhas.length, elegiveis: res.linhas.filter(l=>l.elegivel).length, mp: {} };
  for (const m of MARKETPLACES){
    const r = { cadastrados:0, ativos:0, erros:0, Inativar:0, Dif:0, Ativar:0, Subir:0, Igual:0, Manter:0, pub:{}, orfaos:0 };
    const conta = (x) => {
      if (x.cad){ r.cadastrados++; r.pub[x.pub||'—'] = (r.pub[x.pub||'—']||0)+1; }
      if (x.publicado) r.ativos++;
      if (x.erro) r.erros++;
      if (x.status) r[x.status]++;
    };
    for (const l of res.linhas) conta(l.mp[m.id]);
    for (const o of (res.orfaos[m.id]||[])){ conta(o); if (o.publicado) r.orfaos++; }
    r.final = r.Igual + r.Dif + r.Manter + r.Ativar + r.Subir;
    out.mp[m.id] = r;
  }
  out.outros = Object.fromEntries(Object.entries(res.outros).map(([k,v])=>[k, v.size]));
  return out;
}

if (typeof module !== 'undefined') module.exports = { normalizaPublicacao, ACOES, PUB_ORDEM, DEFAULT_PREMISSAS, MARKETPLACES, setCanais, custoCanal, tabelaVigente, lerTabelaFrete, pesoLimite, hojeISO, STATUS, STATUS_LABEL, normalizaProduto, normalizaAnuncio, calcula, resumo, mpFromAnymarket, elegibilidade, custoShopee, custoMeli, custoMagalu, precoRef };

/* ============================ SUPABASE ============================ */
function getConfig(){
  const U=String(SUPABASE_URL).trim().replace(/\/+$/,''), K=String(SUPABASE_ANON_KEY).replace(/\s+/g,'');
  if (U && K) return { url:U, key:K, fixed:true };
  try { const c = JSON.parse(localStorage.getItem('matcon_sb')||'null'); if (c && c.url && c.key) return c; } catch(e){}
  return null;
}
async function boot(){
  const cfg = getConfig();
  if (!cfg){ S.local = true; showApp(); return; }
  S.local = false;
  S.sb = supabase.createClient(cfg.url, cfg.key);
  const { data } = await S.sb.auth.getSession();
  if (data.session){ S.user = data.session.user; showApp(); await loadAll(); }
  else showLogin();
}
function showLogin(){ $('#appView').classList.add('hidden'); $('#loginView').classList.remove('hidden'); setTimeout(()=>$('#lgEmail').focus(),50); }
function showApp(){
  $('#loginView').classList.add('hidden'); $('#appView').classList.remove('hidden');
  $('#localBanner').classList.toggle('hidden', !S.local);
  $('#btnLogout').classList.toggle('hidden', S.local);
  $('#whoBox').textContent = S.local ? 'Sem conexão' : (S.user?.email || '');
  recalc(); render();
}
async function doLogin(){
  const email=$('#lgEmail').value.trim(), password=$('#lgPass').value;
  $('#lgErr').textContent=''; $('#lgBtn').disabled=true;
  const { data, error } = await S.sb.auth.signInWithPassword({ email, password });
  $('#lgBtn').disabled=false;
  if (error){
    const m = error.message==='Invalid login credentials' ? 'e-mail ou senha incorretos.'
      : /invalid api key/i.test(error.message) ? 'a chave do Supabase (anon key) está errada ou é de outro projeto. Clique em Conexão e confira.'
      : /email not confirmed/i.test(error.message) ? 'usuário ainda não confirmado. No Supabase, recrie o usuário marcando Auto Confirm User.'
      : error.message;
    $('#lgErr').textContent = 'Não foi possível entrar: ' + m; return;
  }
  S.user = data.user; showApp(); await loadAll();
}
$('#lgPass').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
async function doLogout(){ if(S.sb) await S.sb.auth.signOut(); location.reload(); }

async function fetchAll(table, order){
  const out=[]; const step=1000; let from=0;
  while(true){
    const { data, error } = await S.sb.from(table).select('*').order(order).range(from, from+step-1);
    if (error) throw error;
    out.push(...data);
    if (data.length < step) break;
    from += step;
    loading(true, `Carregando ${table.replace('mc_','')}… ${fN(out.length)}`);
  }
  return out;
}
async function loadAll(){
  try{
    loading(true,'Carregando dados…');
    const [prem, produtos, anuncios, acoes, snaps, cargas, publicacoes] = await Promise.all([
      S.sb.from('mc_premissas').select('*').eq('id',1).maybeSingle(),
      fetchAll('mc_produtos','sku'),
      fetchAll('mc_anuncios','id'),
      fetchAll('mc_acoes','sku'),
      S.sb.from('mc_snapshots').select('*').order('criado_em',{ascending:false}).limit(90),
      S.sb.from('mc_cargas').select('*').order('criado_em',{ascending:false}).limit(40),
      fetchAll('mc_publicacoes','id').catch(e=>{ console.warn(e); toast('Tabela mc_publicacoes não encontrada: rode o supabase_atualizacao_v2.sql', 8000); return []; })
    ]);
    S.publicacoes = publicacoes;
    if (prem.data?.dados) S.P = mergeP(prem.data.dados);
    S.produtos = produtos.map(p => ({...p, name:p.name||'', marca:p.marca||'', departamento:p.departamento||'', status:p.status||'', inflamavel:p.inflamavel||'', seller_id:String(p.seller_id??'')}));
    S.anuncios = anuncios;
    S.acoes = Object.fromEntries(acoes.map(a=>[acaoKey(a.sku,a.marketplace), a]));
    S.snapshots = (snaps.data||[]).reverse();
    S.cargas = cargas.data||[];
    recalc(); render();
  } catch(e){ console.error(e); toast('Erro ao carregar: ' + (e.message||e), 6000); }
  finally{ loading(false); }
}
function mergeP(d){
  const P = structuredClone(DEFAULT_PREMISSAS);
  for (const k of Object.keys(d)) if (d[k] && typeof d[k]==='object' && !Array.isArray(d[k])) P[k] = {...P[k], ...d[k]}; else P[k] = d[k];
  return P;
}

/* ============================ CÁLCULO ============================ */
function recalc(){
  S.res = calcula(S.produtos, S.anuncios, S.publicacoes, S.P);
  S.sum = resumo(S.res);
  refreshCanais();
  S.deps = [...new Set(S.res.linhas.map(l=>l.departamento).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
}
function pendentes(mp){
  let n=0; for (const l of S.res.linhas) if (isAcao(l.mp[mp].status) && !isDone(l,mp)) n++;
  return n + (S.res.orfaos[mp]||[]).filter(o=>o.status==='Inativar' && !S.acoes[acaoKey(o.sku,mp)]?.concluido).length;
}

function buildNav(){
  const tabs = [['geral','Visão geral'], ...MARKETPLACES.map(m=>[m.id,m.nome]), ['catalogo','Catálogo'], ['premissas','Premissas'], ['cargas','Cargas']];
  if (!tabs.some(t=>t[0]===S.tab) && S.tab!=='outros') S.tab='geral';
  $('#nav').innerHTML = tabs.map(([id,t])=>`<button data-tab="${id}" class="${S.tab===id?'on':''}">${MPN[id]?icoHTML(id,'sm'):''}${esc(t)}</button>`).join('');
  document.querySelectorAll('#nav button').forEach(b => b.onclick = () => {
    if (S.tab==='premissas' && b.dataset.tab!=='premissas') S.Pd = null;
    S.tab=b.dataset.tab; document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('on',x===b)); render(); window.scrollTo(0,0);
  });
}
function destroyCharts(){ Object.values(S.charts).forEach(c=>c.destroy()); S.charts={}; }
function render(){
  destroyCharts();
  const t=S.tab;
  if (t==='geral') renderGeral();
  else if (MPN[t]) renderMP(t);
  else if (t==='catalogo') renderCatalogo();
  else if (t==='premissas') renderPremissas();
  else if (t==='cargas') renderCargas();
  else if (t==='outros') renderOutros();
}

const ST_OPTS = [['acoes','Todas as ações'],['Inativar','Inativar'],['Dif','Preço diferente'],['Ativar','Ativar anúncio'],['Subir','Subir'],['manter','Manter'],['final','Final projetado'],['inviavel','Inviável (comissão alta)'],['todos','Todos os SKUs']];
const PUB_OPTS = [['','Qualquer publicação'],['cad','Cadastrado (qualquer status)'],['nc','Não cadastrado'],['Ativo','Publicado (Ativo)'],['Sem estoque','Sem estoque'],['Pausado','Pausado'],['Não publicado','Não publicado'],['Finalizado','Finalizado'],['erro','Com erro de transmissão']];

function iconeCanal(id){

function icoHTML(id, cls=''){ const m=MARKETPLACES.find(x=>x.id===id), src=iconeCanal(id); return src && m ? `<img class="ico ${cls}" src="${src}" alt="${esc(m.nome)}">` : ''; }

function isExtra(mp){ return !!MARKETPLACES.find(m=>m.id===mp)?.extra; }

function pubHTML(x){

  const st = x.pub || '—';
  return `<span class="pp"><i style="background:${PUB_COR[st]||'#c3c2b7'}"></i>${esc(st)}${x.n>1?` <span class="muted">(${x.n})</span>`:''}</span>${x.erro?`<span class="errb" title="${esc((x.erros||[]).join(' | ')||'Erro de transmissão')}">Erro</span>`:''}`;

/* Motivo por trás da ação de cada SKU no canal */
function situacao(l, mp, o){
  if (!l){
    if (!o || !o.publicado) return 'Anúncio de SKU que não está no catálogo Flagship (seller ' + S.P.seller_id + ')' + (o?.pub ? ' · ' + o.pub.toLowerCase() : '');
    return 'Publicado, mas o SKU não está no catálogo Flagship (seller ' + S.P.seller_id + ')';
  }
  const x = l.mp[mp], s = x.status, lim = S.P.comissao_max;
  const anuncio = x.cad ? (x.publicado ? 'publicado' : 'anúncio ' + String(x.pub||'').toLowerCase()) : 'sem anúncio';
  if (!l.elegivel) return 'Não elegível: ' + l.motivos.map(m => {
    if (m.startsWith('Dimensão')){ const d=[['altura',l.altura],['largura',l.largura],['profundidade',l.profundidade]].filter(x=>(x[1]||0)>=S.P.dim_max).map(x=>x[0]+' '+fN(x[1],x[1]%1?1:0)+' cm'); return m+' ('+d.join(', ')+')'; }
    if (m.startsWith('Peso')) return m+' ('+fN(l.peso,1)+' kg)';
    return m; }).join(' · ') + (s==='Inativar' ? '' : ' · ' + anuncio);
  if (x.pct == null) return 'Sem frete cadastrado para ' + fN(l.peso,3) + ' kg · ' + anuncio;
  if (s==='Inativar' || !s) return 'Comissão estimada ' + fP(x.pct) + ' acima do limite de ' + fP(lim,0) + (s ? '' : ' · ' + anuncio);
  if (s==='Dif'){ const d = x.ativo - l.preco_ref; return 'Canal ' + (d>0?'acima':'abaixo') + ' do site em ' + fR(Math.abs(d)) + ' (' + (d>0?'+':'−') + fN(Math.abs(d)/l.preco_ref*100,1) + '%)'; }
  if (s==='Igual') return 'Publicado com preço igual ao site · comissão ' + fP(x.pct);
  if (s==='Manter') return 'Publicado dentro das regras · comissão ' + fP(x.pct);
  if (s==='Ativar') return 'Já cadastrado (' + String(x.pub||'').toLowerCase() + ') e elegível · comissão ' + fP(x.pct);
  if (s==='Subir') return 'Elegível e sem anúncio no canal · comissão ' + fP(x.pct);
  return '';
}

function passaPub(fpub, x){
  if (!fpub) return true;
  if (fpub==='cad') return !!x.cad;
  if (fpub==='nc') return !x.cad;
  if (fpub==='erro') return !!x.erro;
  return x.cad && x.pub===fpub;
}
function passaSt(fst, s, l, x){
  if (fst==='todos') return true;
  if (fst==='acoes') return isAcao(s);
  if (fst==='manter') return s==='Igual' || s==='Manter';
  if (fst==='final') return ['Igual','Dif','Manter','Ativar','Subir'].includes(s);
  if (fst==='inviavel') return !!(l && l.elegivel && x.pct!=null && x.pct>S.P.comissao_max);
  return s===fst;
}
function mpRows(mp){
  const f0=S.f[mp]; const q=f0.q.trim().toLowerCase();
  // busca por SKU/nome/EAN procura em todos os SKUs, ignorando os outros filtros
  const f = q ? { ...f0, st:'todos', pub:'', dep:'', pend:false, oc:'' } : f0;
  const linha = (l, x, o) => ({ l, o, x, sku:l?l.sku:o.sku, name:l?l.name:(o.titulo||'(SKU fora do catálogo Flagship)'), dep:l?l.departamento:'', stock:l?l.stock:null, estc:x.estoque_canal, pde:l?l.price:null, ppor:l?l.preco_ref:null, ativo:x.ativo,
    frete: !l ? null : isExtra(mp) ? (x.frete==null && x.fixo==null ? null : (x.frete||0)+(x.fixo||0)) : (x.frete ?? x.fixo), comissao: !l ? null : mp==='shopee' ? x.com : x.comissao, pct:l?x.pct:null,
    st: l ? statusLabel(l,mp) : (o.status ? STATUS_LABEL[o.status] : 'Fora do catálogo'), s: x.status, pubTxt: x.cad ? (x.pub||'') : 'Não cadastrado', sit: situacao(l,mp,o), orfao:!l });
  let rows = [];
  for (const l of S.res.linhas){
    const x=l.mp[mp], s=x.status;
    if (!passaSt(f.st, s, l, x)) continue;
    if (!passaPub(f.pub, x)) continue;
    if (f.dep && l.departamento!==f.dep) continue;
    if (f.pend && (!isAcao(s) || isDone(l,mp))) continue;
    if (q && !(l.sku.toLowerCase().includes(q) || l.name.toLowerCase().includes(q) || l.marca.toLowerCase().includes(q) || (l.ean||'').includes(q))) continue;
    rows.push(linha(l, x, null));
  }
  if (!f.dep){
    for (const o of (S.res.orfaos[mp]||[])){
      if (!passaSt(f.st, o.status, null, o) || !passaPub(f.pub, o)) continue;
      if (f.pend && (o.status!=='Inativar' || S.acoes[acaoKey(o.sku,mp)]?.concluido)) continue;
      if (q && !o.sku.toLowerCase().includes(q) && !(o.titulo||'').toLowerCase().includes(q)) continue;
      rows.push(linha(null, o, o));
    }
  }
  const nOut = MARKETPLACES.length - 1;
  rows.forEach(r=>{ r.ocIds = outrosCanais(r.sku, r.l, mp); r.oc = r.ocIds.map(i=>MPS[i]).join(' · '); });
  if (f.oc) rows = rows.filter(r => f.oc==='algum' ? r.ocIds.length>0 : f.oc==='nenhum' ? r.ocIds.length===0 : f.oc==='todos2' ? r.ocIds.length===nOut : r.ocIds.includes(f.oc.slice(3)));
  return rows;
}

function catRows(){
  const f0=S.f.cat, q=f0.q.trim().toLowerCase();
  const f = q ? { ...f0, el:'', mot:'', dep:'', can:'' } : f0;
  const passaCan = (mpx) => {
    if (!f.can || f.can==='fora') return true;
    const pubs = MARKETPLACES.filter(m=>mpx[m.id].publicado).length, cads = MARKETPLACES.filter(m=>mpx[m.id].cad).length;
    if (f.can==='pub_algum') return pubs>0; if (f.can==='pub_todos') return pubs===MARKETPLACES.length;
    if (f.can==='pub_nenhum') return pubs===0; if (f.can==='cad_nenhum') return cads===0;
    const [t,id] = f.can.split(':'); const x = mpx[id]; if (!x) return true;
    return t==='p' ? x.publicado : t==='c' ? (x.cad && !x.publicado) : t==='n' ? !x.cad : t==='e' ? !!x.erro : true;
  };
  const row = (l, fo) => { const mpx = l ? l.mp : fo.mp; return { l, fo, mpx,
    pubs: MARKETPLACES.filter(m=>mpx[m.id].publicado).length, ...Object.fromEntries(MARKETPLACES.map(m=>['c_'+m.id, mpx[m.id].publicado?3:mpx[m.id].cad?2:1])),
    sku: l?l.sku:fo.sku, name: l?l.name:(fo.titulo||'(sem título)'), marca: l?l.marca:'', dep: l?l.departamento:'', peso: l?l.peso:null, dim: l?(Math.max(l.altura||0,l.largura||0,l.profundidade||0)||null):null, pde: l?l.price:null, ppor: l?l.preco_ref:null, stock: l?l.stock:null,
    mot: !l ? 'Fora da base de produtos (seller ' + S.P.seller_id + ')' : l.elegivel ? '' : l.motivos.join(' · ') }; };
  const out = [];
  if (f.can!=='fora') for (const l of S.res.linhas){
    if (f.el==='s' && !l.elegivel) continue;
    if (f.el==='n' && l.elegivel) continue;
    if (f.el==='i' && !l.incompleto) continue;
    if (f.el==='h' && l.status.toLowerCase()!=='habilitado') continue;
    if (f.mot && !l.motivos.includes(f.mot)) continue;
    if (f.dep && l.departamento!==f.dep) continue;
    if (!passaCan(l.mp)) continue;
    if (q && !(l.sku.toLowerCase().includes(q)||l.name.toLowerCase().includes(q)||l.marca.toLowerCase().includes(q)||(l.ean||'').includes(q))) continue;
    out.push(row(l,null));
  }
  if (!f.el && !f.mot && !f.dep) for (const fo of foraDaBase()){
    if (f.can!=='fora' && !passaCan(fo.mp)) continue;
    if (q && !(fo.sku.toLowerCase().includes(q) || fo.titulo.toLowerCase().includes(q))) continue;
    out.push(row(null,fo));
  }
  return out;
}
function drawCat(){
  const f=S.f.cat, rows=catRows();
  const cols=[{k:'sku',t:'SKU',w:'7%'},{k:'name',t:'Produto',w:'auto'},{k:'marca',t:'Marca',w:'7.5%',cls:'hl'},{k:'peso',t:'Peso kg',w:'5%',n:1,cls:'hl'},{k:'dim',t:'Maior dim.',w:'5.5%',n:1,cls:'hl'},{k:'pde',t:'Preço De (R$)',w:'6.5%',n:1,cls:'hm'},{k:'ppor',t:'Preço Por (R$)',w:'6.5%',n:1},{k:'stock',t:'Estoque',w:'5%',n:1,cls:'hm'},
    ...MARKETPLACES.map(m=>({k:'c_'+m.id, t:`${icoHTML(m.id,'sm')}${esc(m.sigla)}`, w:Math.min(8.5, 30/MARKETPLACES.length).toFixed(1)+'%'})), {k:'mot',t:'Situação',w:'12%'}];
  rows.sort((a,b)=>{ const x=a[f.sort], y=b[f.sort]; if(x==null&&y==null) return 0; if(x==null) return 1; if(y==null) return -1; return (typeof x==='string'?x.localeCompare(y,'pt-BR'):x-y)*f.dir; });
  const per=50, pages=Math.max(1,Math.ceil(rows.length/per)); f.page=Math.min(f.page,pages-1);
  const pg=rows.slice(f.page*per,f.page*per+per);
  $('#catTable').innerHTML = `<table class="tbl"><colgroup>${cols.map(c=>`<col class="${c.cls||''}" style="width:${c.w}">`).join('')}</colgroup>
  <thead><tr>${cols.map(c=>`<th class="s ${c.n?'n':''} ${c.cls||''}" data-k="${c.k}">${c.t}${f.sort===c.k?(f.dir>0?' ↑':' ↓'):''}</th>`).join('')}</tr></thead>
  <tbody>${pg.map(r=>`<tr><td class="mono">${esc(r.sku)}</td><td>${esc(r.name)}</td><td class="hl">${esc(r.marca)}</td><td class="n hl">${!r.l?'':r.peso==null?'<span class="muted">vazio</span>':fN(r.peso,3)}</td><td class="n hl">${!r.l?'':r.dim==null?'<span class="muted">vazio</span>':fN(r.dim,1)}</td><td class="n hm">${fM(r.pde)}</td><td class="n">${fM(r.ppor)}</td><td class="n hm">${fN(r.stock)}</td>${MARKETPLACES.map(m=>`<td>${pubHTML(r.mpx[m.id])}</td>`).join('')}<td>${r.mot?`<span class="pill ${r.l?'':'Inativar'}">${esc(r.mot)}</span>`:`<span class="pill ok">Elegível</span>`}</td></tr>`).join('') || `<tr><td colspan="${cols.length}"><div class="empty">Nenhum SKU com esses filtros.</div></td></tr>`}</tbody></table>
  ${pagerHTML(rows.length,f.page,pages,'pgCat(')}`;
  const canTxt = f.can ? ' · ' + (catCanOpts().find(o=>o[0]===f.can)||['',''])[1].toLowerCase() : '';
  $('#catListTit').textContent = f.q.trim() ? `SKUs do catálogo · busca “${f.q.trim()}” em todos os SKUs — ${fN(rows.length)}` : `SKUs do catálogo${canTxt} — ${fN(rows.length)}`;
  ['#cel','#cmot','#cdep','#ccan'].forEach(id=>{ const el=$(id); if(el){ el.disabled=!!f.q.trim(); el.title=f.q.trim()?'Durante a busca, a lista mostra todos os SKUs':''; } });
  $('#catTable').querySelectorAll('th.s').forEach(th=>th.onclick=()=>{ const k=th.dataset.k; if(f.sort===k) f.dir*=-1; else { f.sort=k; f.dir=k.startsWith('c_')?-1:1; } drawCat(); });
}
function pgCat(p){ S.f.cat.page=p; drawCat(); }

function outrosRows(){
  const q=(S.f.out.q||'').trim().toLowerCase(); const cat=new Map(S.res.linhas.map(l=>[l.sku,l]));
  const pubs = S.publicacoes.map(p=>({ sku:p.sku, titulo:p.titulo, conta:p.conta, sku_marketplace:p.sku_marketplace, cod_marketplace:p.codigo, preco_de:null, preco_por:null, marketplace:p.marketplace }));
  return [...S.anuncios, ...pubs].filter(a=>a.marketplace===S.outro && (!q || a.sku.toLowerCase().includes(q) || (a.titulo||'').toLowerCase().includes(q)))
    .map(a=>({ a, l:cat.get(a.sku)||null }));
}

function vigInfo(P, id){
  const obj = id==='meli'||id==='magalu' ? P[id] : canalExtra(P,id);
  const t = tabelaVigente(obj), k = (obj.historico||[]).indexOf(t);
  const base = id==='meli'||id==='magalu' ? id+'.' : 'canais_extra.'+(P.canais_extra||[]).indexOf(obj)+'.';
  const pre = k>=0 ? base+'historico.'+k+'.' : base;
  const prox = (obj.historico||[]).filter(h=>h.vigencia>hojeISO()).sort((a,b)=>a.vigencia<b.vigencia?-1:1)[0];
  const nota = `<div class="note" style="margin-bottom:10px">${k>=0?`Tabela vigente desde <b>${fDia(t.vigencia)}</b> · ${esc(t.arquivo||'')}`:'Tabela vigente: <b>padrão do Simulador V9</b>'}${prox?` · próxima tabela entra em <b>${fDia(prox.vigencia)}</b>`:''}. Para trocar, use “Subir nova tabela”.</div>`;
  return { t, pre, nota };
}

function subirIcone(i, input){
  const f=input.files[0]; if(!f) return;
  const r=new FileReader(); r.onload=()=>{ const img=new Image(); img.onload=()=>{
    const N=128, cv=document.createElement('canvas'); cv.width=cv.height=N; const cx=cv.getContext('2d');
    cx.imageSmoothingQuality='high'; const sz=Math.min(img.width,img.height); cx.drawImage(img,(img.width-sz)/2,(img.height-sz)/2,sz,sz,0,0,N,N);
    const url=cv.toDataURL('image/png'); editCanais(x=>{ x[i].icone=url; });
  }; img.src=r.result; }; r.readAsDataURL(f);
}
function editCanais(fn, foco){ S.Pd = readPremissas(); S.Pd.canais_extra ||= []; fn(S.Pd.canais_extra); if (foco!=null) S.focoCanal = foco; renderPremissas(); }
function addCanal(nome=''){ editCanais(c=>c.push({ id:'x_'+Date.now().toString(36), nome, anymarket:nome, sigla:nome.split(' ')[0]||'', cor_fundo:'#52514e', cor_fonte:'#ffffff', com:null, fixo:0, faixas_peso:[], valores:[] }), (S.Pd?.canais_extra||S.P.canais_extra||[]).length); }
function rmCanal(i){ if(!confirm('Remover este canal? Ele sai das abas e do resumo depois de salvar.')) return; editCanais(c=>c.splice(i,1)); }
function addFaixa(i){ editCanais(c=>{ c[i].faixas_peso.push(null); c[i].valores.push(null); }); }
function rmFaixa(i,j){ editCanais(c=>{ c[i].faixas_peso.splice(j,1); c[i].valores.splice(j,1); }); }
function novoCanal(nome){
  if (S.tab!=='premissas'){ S.Pd=null; S.tab='premissas'; buildNav(); render(); }
  const ja = (S.Pd.canais_extra||[]).findIndex(c=>String(c.anymarket||c.nome).trim().toLowerCase()===nome.trim().toLowerCase());
  if (ja>=0){ S.focoCanal=ja; renderPremissas(); return; }
  addCanal(nome);
}
function readPremissas(){
  const P=structuredClone(S.Pd || S.P);
  document.querySelectorAll('[data-p]').forEach(el=>{
    const path=el.dataset.p.split('.'); let o=P; for(let i=0;i<path.length-1;i++) o=o[path[i]];
    const k=path[path.length-1]; const t=el.dataset.t;
    o[k] = t==='s' ? el.value.trim() : t==='b' ? el.value==='true' : Number(el.value);
  });
  return P;
}
async function savePremissas(){
  const P = readPremissas();
  for (const c of (P.canais_extra||[])){
    c.faixas_peso = c.faixas_peso.map(Number); c.valores = c.valores.map(Number);
    if (!c.nome){ toast('Dê um nome ao canal novo antes de salvar', 4000); return; }
    if (!(c.com > 0)){ toast(`Informe a comissão do canal ${c.nome} antes de salvar`, 4000); return; }
    if (!c.anymarket) c.anymarket = c.nome;
    if (!c.sigla) c.sigla = c.nome;
  }
  S.P = P; S.Pd = structuredClone(P);
  if (!S.local){
    const { error } = await S.sb.from('mc_premissas').upsert({ id:1, dados:S.P, usuario:S.user?.email||null, atualizado_em:new Date().toISOString() });
    if (error){ toast('Erro ao salvar: '+error.message,5000); return; }
  }
  recalc(); renderPremissas(); toast('Premissas salvas e painéis recalculados');
}
function resetPremissas(){ if(!confirm('Restaurar as premissas padrão do simulador? Os canais cadastrados em “Outros canais” são mantidos.')) return; const ex=readPremissas().canais_extra||[]; S.Pd=structuredClone(DEFAULT_PREMISSAS); S.Pd.canais_extra=ex; renderPremissas(); toast('Padrão restaurado — clique em Salvar para gravar'); }

async function lerFrete(file){
  const st=$('#freteStatus'), id=$('#freteCanal').value, vig=$('#freteVig').value;
  if (!vig){ st.innerHTML='<div class="err">Informe a data de vigência.</div>'; return; }
  try{
    const wb = XLSX.read(await file.arrayBuffer(), { type:'array' });
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header:1, defval:null, raw:true, blankrows:false });
    const t = lerTabelaFrete(aoa);
    if (!t.faixas_peso.length || !t.colunas.length){ st.innerHTML='<div class="err">Não encontrei a tabela. A primeira coluna precisa ter as faixas de peso (ex.: “Até 0,3 kg”, “De 0,3 a 0,5 kg”).</div>'; return; }
    const atual = tabelaVigente(freteObj(S.P,id));
    S.freteNovo = { id, vig, arquivo:file.name, t };
    let resumo, extra='';
    if (id==='meli'){
      const ok = t.colunas.length === 8 || confirm(`A planilha tem ${t.colunas.length} faixas de preço (o esperado são 8). Usar mesmo assim?`);
      if (!ok){ st.innerHTML=''; return; }
      resumo = `${fN(t.faixas_peso.filter(x=>x<1e8).length)} faixas de peso × ${t.colunas.length} faixas de preço`;
      extra = compararMeli(atual, t);
    } else {
      resumo = `${fN(t.faixas_peso.filter(x=>x<1e8).length)} faixas de peso`;
      if (t.colunas.length>1) extra = `<div style="margin-top:6px">Coluna de valores a usar: <select id="freteCol">${t.colunas.map((c,i)=>`<option value="${i}">${esc(c)}</option>`).join('')}</select></div>`;
    }
    st.innerHTML = `<div class="note">✔ <b>${esc(file.name)}</b> — ${resumo}. Vale para <b>${esc(canaisComFrete().find(c=>c[0]===id)[1])}</b> a partir de <b>${fDia(vig)}</b>${vig>hojeISO()?' (até lá continua a tabela atual)':''}.${extra}</div>
      <div style="display:flex;gap:8px;margin-top:10px"><button class="btn lime" onclick="gravarFrete()">Confirmar tabela</button><button class="btn" onclick="$('#freteStatus').innerHTML=''">Cancelar</button></div>`;
  } catch(e){ console.error(e); st.innerHTML=`<div class="err">Erro ao ler a planilha: ${esc(e.message||e)}</div>`; }
}
function compararMeli(atual, t){
  const pesoA=atual.faixas_peso.map(Number);
  let n=0, mud=0, soma=0;
  t.faixas_peso.forEach((lim,i)=>{ const ia=pesoA.findIndex(x=>Math.abs(x-lim)<1e-9); if(ia<0) return;
    t.matriz[i].forEach((v,j)=>{ const a=(atual.tabela[ia]||[])[j]; if(a==null||v==null) return; n++; if(Math.abs(a-v)>0.004){ mud++; soma+=(v-a)/a; } }); });
  const novas = t.faixas_peso.filter(l=>!pesoA.some(x=>Math.abs(x-l)<1e-9)).length;
  return `<div style="margin-top:6px">Em relação à tabela vigente: <b>${fN(mud)}</b> de ${fN(n)} valores mudaram${mud?`, variação média de <b>${(soma/mud>0?'+':'')+fN(soma/mud*100,1)}%</b>`:''}${novas?` · ${fN(novas)} faixas de peso novas`:''}.</div>`;
}
async function gravarFrete(){
  const N=S.freteNovo; if(!N) return;
  const P=structuredClone(S.P), o=freteObj(P,N.id); o.historico ||= [];
  const ent = { vigencia:N.vig, arquivo:N.arquivo, carregado_em:new Date().toISOString(), usuario:S.user?.email||null, faixas_peso:N.t.faixas_peso };
  if (N.id==='meli'){ ent.tabela=N.t.matriz; ent.colunas=N.t.colunas; ent.faixas_preco=N.t.colunas.slice(1).map(precoInicio); }
  else { const c=+($('#freteCol')?.value||0); ent.valores=N.t.matriz.map(r=>r[c]); ent.coluna=N.t.colunas[c]; }
  o.historico.push(ent);
  if (await salvarP(P)){ S.freteNovo=null; toast('Tabela de frete gravada'); renderCargas(); }
}
async function rmFrete(id,k){
  if(!confirm('Excluir esta tabela de frete? Se ela for a vigente, volta a valer a anterior.')) return;
  const P=structuredClone(S.P); freteObj(P,id).historico.splice(k,1);
  if (await salvarP(P)){ toast('Tabela excluída'); renderCargas(); }
}
async function salvarP(P){
  if (!S.local){
    const { error } = await S.sb.from('mc_premissas').upsert({ id:1, dados:P, usuario:S.user?.email||null, atualizado_em:new Date().toISOString() });
    if (error){ toast('Erro ao salvar: '+error.message,5000); return false; }
  }
  S.P=P; S.Pd=null; recalc(); return true;
}

/* Fila de arquivos: cada seleção ou arrasto soma à lista até confirmar */
S.fila = [];
function lerArquivos(files){
  for (const f of files){ const i=S.fila.findIndex(x=>x.name===f.name); if(i>=0) S.fila[i]=f; else S.fila.push(f); }
  return processaFila();
}
function rmFila(i){ S.fila.splice(i,1); if(S.fila.length) processaFila(); else $('#upStatus').innerHTML=''; }
function limparFila(){ S.fila=[]; $('#upStatus').innerHTML=''; }
async function processaFila(){
  const files = S.fila;
  const st=$('#upStatus');
  st.innerHTML = `<div class="muted">Lendo ${files.length} arquivo(s)…</div>`;
  await new Promise(r=>setTimeout(r,30));
  let base=null, anym=[], pubs=[], nomes=[], ignorados=[]; const tipoArq={};
  try{
    for (const file of files){
      const buf = await file.arrayBuffer();
      const isCsv = /\.csv$/i.test(file.name);
      const wb = XLSX.read(buf, { type:'array', raw:isCsv, codepage:65001 });
      let achou=false;
      for (const name of wb.SheetNames){
        const aoa = XLSX.utils.sheet_to_json(wb.Sheets[name], { header:1, defval:null, raw:true, blankrows:false });
        for (let i=0;i<Math.min(10,aoa.length);i++){
          const h=(aoa[i]||[]).map(x=>String(x??'').trim().toLowerCase());
          const toObjs = () => { const hdr=aoa[i].map(x=>String(x??'').trim()); return aoa.slice(i+1).map(r=>{ const o={}; hdr.forEach((k,j)=>{ if(k) o[k]=r[j]; }); return o; }); };
          if (h.includes('sku') && h.includes('seller_id') && h.includes('price')){ base={ sheet:name, arquivo:file.name, rows:toObjs() }; achou=true; (tipoArq[file.name] ||= []).push('Base de produtos'); break; }
          if (h.includes('sku') && h.includes('status da publicação') && h.includes('marketplace')){ const rows=toObjs().map(normalizaPublicacao).filter(a=>a.sku); pubs.push({ arquivo:file.name, rows }); achou=true; (tipoArq[file.name] ||= []).push('Transmissões '+[...new Set(rows.map(r=>r.marketplace))].join(', ')); break; }
          if (h.includes('sku interno') && h.includes('marketplace') && h.includes('preço por')){ anym.push(...toObjs().map(normalizaAnuncio).filter(a=>a.sku)); achou=true; (tipoArq[file.name] ||= []).push('Preços Anymarket'); break; }
        }
      }
      (achou ? nomes : ignorados).push(file.name);
    }
    if (!base && !anym.length && !pubs.length){ st.innerHTML = `<div class="err">Não reconheci nenhum arquivo. Envie a base de produtos ou os exports de transmissões do Anymarket.</div><div style="margin-top:8px"><button class="btn" onclick="limparFila()">Limpar lista</button></div>`; return; }
    const produtos = base ? base.rows.map(r=>normalizaProduto(r,S.P)).filter(p=>p.sku) : null;
    const publicacoes = pubs.flatMap(p=>p.rows);
    const porMp = {}; publicacoes.forEach(a=>{ const k=a.marketplace; (porMp[k] ||= {n:0,at:0,err:0}); porMp[k].n++; if(a.status_publicacao==='Ativo') porMp[k].at++; if(/erro/i.test(a.status_transmissao)) porMp[k].err++; });
    const porMpP = {}; anym.forEach(a=>porMpP[a.marketplace]=(porMpP[a.marketplace]||0)+1);
    const sellers = produtos ? produtos.filter(p=>p.seller_id===String(S.P.seller_id)).length : 0;
    const lista = `<table class="tbl" style="margin-bottom:10px"><thead><tr><th>Arquivo na lista</th><th style="width:38%">Reconhecido como</th><th style="width:70px"></th></tr></thead><tbody>${files.map((f,i)=>`<tr><td>${esc(f.name)}</td><td>${tipoArq[f.name]?esc(tipoArq[f.name].join(' + ')):'<span class="err">Não reconhecido</span>'}</td><td class="c"><button class="btn sm" onclick="rmFila(${i})">Remover</button></td></tr>`).join('')}</tbody></table>`;
    st.innerHTML = lista + `<div class="note">
      ${produtos?`<div>✔ <b>Base de produtos</b> (${esc(base.arquivo)}): ${fN(produtos.length)} SKUs, ${fN(sellers)} do seller ${esc(S.P.seller_id)}.</div>`:''}
      ${Object.entries(porMp).map(([k,v])=>`<div>✔ <b>Anúncios ${esc(k)}</b>: ${fN(v.n)} anúncios · ${fN(v.at)} ativos · ${fN(v.err)} com erro de transmissão.</div>`).join('')}
      ${anym.length?`<div>✔ <b>Preços Anymarket</b> (opcional): ${Object.entries(porMpP).map(([k,v])=>esc(k)+' '+fN(v)).join(' · ')}.</div>`:''}
      ${ignorados.length?`<div class="err">Não reconhecidos: ${ignorados.map(esc).join(', ')}</div>`:''}
      <div style="margin-top:6px">${S.local?'Os dados vão ficar só nesta aba (modo local).':'Substitui no Supabase só o que veio agora: a base inteira (se enviada) e os anúncios de cada marketplace enviado.'}</div></div>
      <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="btn lime" id="btnConf">Confirmar carga (${fN(nomes.length)} arquivo${nomes.length>1?'s':''})</button><button class="btn" onclick="$('#fileInput').click()">+ Adicionar mais arquivos</button><button class="btn" onclick="limparFila()">Cancelar</button></div>
      <div class="progress hidden" id="prog"><div></div></div><div class="muted" id="progMsg" style="font-size:12px;margin-top:4px"></div>`;
    $('#btnConf').onclick = () => gravarCarga(nomes.join(', '), produtos, anym.length?anym:null, publicacoes.length?publicacoes:null);
  } catch(e){ console.error(e); st.innerHTML = `<div class="err">Erro ao ler o arquivo: ${esc(e.message||e)}</div>`; }
}
function prog(p, msg){ const b=$('#prog'); if(!b) return; b.classList.remove('hidden'); b.firstElementChild.style.width=(p*100).toFixed(0)+'%'; $('#progMsg').textContent=msg||''; }

async function gravarCarga(arquivo, produtos, anuncios, publicacoes){
  $('#btnConf').disabled=true;
  try{
    if (S.local){
      if (produtos) S.produtos=produtos;
      if (anuncios) S.anuncios=anuncios;
      if (publicacoes){ const mps=new Set(publicacoes.map(p=>p.marketplace)); S.publicacoes=[...S.publicacoes.filter(p=>!mps.has(p.marketplace)), ...publicacoes]; }
      const now=new Date().toISOString();
      if (publicacoes) S.cargas.unshift({tipo:'publicacoes',arquivo,linhas:publicacoes.length,criado_em:now});
      if (produtos) S.cargas.unshift({tipo:'base',arquivo,linhas:produtos.length,criado_em:now});
      if (anuncios) S.cargas.unshift({tipo:'anymarket',arquivo,linhas:anuncios.length,criado_em:now});
      recalc(); S.snapshots.push({criado_em:now, resumo:S.sum}); S.fila = [];
      toast('Carga aplicada (modo local)'); goTab('geral'); return;
    }
    const steps = (produtos?produtos.length:0) + (anuncios?anuncios.length:0) + (publicacoes?publicacoes.length:0); let done=0; const CH=1000;
    const who = S.user?.email||null;
    if (produtos){
      const { data:c, error:e1 } = await S.sb.from('mc_cargas').insert({ tipo:'base', arquivo, linhas:produtos.length, usuario:who }).select().single();
      if (e1) throw e1;
      // remove SKUs duplicados (fica a última ocorrência)
      const uniq = [...new Map(produtos.map(p=>[p.sku,p])).values()];
      for (let i=0;i<uniq.length;i+=CH){
        const chunk = uniq.slice(i,i+CH).map(p=>({...p, carga_id:c.id, atualizado_em:new Date().toISOString()}));
        const { error } = await S.sb.from('mc_produtos').upsert(chunk, { onConflict:'sku' });
        if (error) throw error;
        done += chunk.length; prog(done/steps, `Gravando produtos… ${fN(i+chunk.length)} de ${fN(uniq.length)}`);
      }
      const { error:e2 } = await S.sb.from('mc_produtos').delete().or(`carga_id.neq.${c.id},carga_id.is.null`);
      if (e2) throw e2;
    }
    if (anuncios){
      const { data:c, error:e1 } = await S.sb.from('mc_cargas').insert({ tipo:'anymarket', arquivo, linhas:anuncios.length, usuario:who }).select().single();
      if (e1) throw e1;
      for (let i=0;i<anuncios.length;i+=CH){
        const chunk = anuncios.slice(i,i+CH).map(a=>({...a, carga_id:c.id}));
        const { error } = await S.sb.from('mc_anuncios').insert(chunk);
        if (error) throw error;
        done += chunk.length; prog(done/steps, `Gravando anúncios… ${fN(i+chunk.length)} de ${fN(anuncios.length)}`);
      }
      const { error:e2 } = await S.sb.from('mc_anuncios').delete().neq('carga_id', c.id);
      if (e2) throw e2;
    }
    if (publicacoes){
      const { data:c, error:e1 } = await S.sb.from('mc_cargas').insert({ tipo:'publicacoes', arquivo, linhas:publicacoes.length, usuario:who }).select().single();
      if (e1) throw e1;
      for (let i=0;i<publicacoes.length;i+=CH){
        const chunk = publicacoes.slice(i,i+CH).map(a=>({...a, carga_id:c.id}));
        const { error } = await S.sb.from('mc_publicacoes').insert(chunk);
        if (error) throw error;
        done += chunk.length; prog(done/steps, `Gravando anúncios dos marketplaces… ${fN(i+chunk.length)} de ${fN(publicacoes.length)}`);
      }
      for (const mkt of new Set(publicacoes.map(p=>p.marketplace))){
        const { error:e2 } = await S.sb.from('mc_publicacoes').delete().eq('marketplace', mkt).neq('carga_id', c.id);
        if (e2) throw e2;
      }
    }
    prog(1,'Recalculando…');
    S.fila = [];
    await loadAll();
    await registrarSnapshot(true);
    toast('Carga gravada no Supabase'); goTab('geral');
  } catch(e){ console.error(e); toast('Erro na carga: '+(e.message||e), 7000); const b=$('#btnConf'); if(b) b.disabled=false; }
}
async function registrarSnapshot(silent){
  if (!S.res.linhas.length){ toast('Carregue a base antes'); return; }
  const snap = { resumo:S.sum, usuario:S.user?.email||null, criado_em:new Date().toISOString() };
  if (!S.local){ const { error } = await S.sb.from('mc_snapshots').insert({ resumo:snap.resumo, usuario:snap.usuario }); if (error){ toast('Erro: '+error.message); return; } }
  S.snapshots.push(snap);
  if (!silent) toast('Fotografia registrada');
}

/* ======================= EXPORTS ======================= */
function baixarXLSX(nome, rows, sheet='Dados'){
  const ws=XLSX.utils.json_to_sheet(rows);
  if (rows.length){ ws['!cols'] = Object.keys(rows[0]).map(k=>({ wch: Math.min(60, Math.max(k.length+2, ...rows.slice(0,200).map(r=>String(r[k]??'').length))) })); ws['!autofilter'] = { ref: ws['!ref'] }; } const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,sheet);
  XLSX.writeFile(wb, nome + '_' + new Date().toISOString().slice(0,10) + '.xlsx');
}
function exportMP(mp){
  const rows=mpRows(mp).map(r=>({ 'SKU':r.sku, 'Produto':r.name, 'Ação':r.st, 'Situação':r.sit, 'Publicação':r.pubTxt, 'EAN':r.l?.ean||'', 'Marca':r.l?.marca||'', 'Departamento':r.dep, 'Estoque site':r.stock, 'Estoque canal':r.estc, 'Peso (kg)':r.l?.peso??null,
    'Preço De':r.pde, 'Preço Por':r.ppor, 'Preço Canal':r.ativo, [mp==='shopee'?'Fixo':isExtra(mp)?'Frete + fixo':'Frete']:r.frete, 'Comissão %':r.l?.mp[mp].com??null, 'Comissão (R$)':r.l?.mp[mp].comissao??null, 'Comissão Estimada %':r.pct==null?null:Math.round(r.pct*10000)/10000,
    'Anúncios no canal':r.x.n||0, 'Código no marketplace':(r.x.codigos||[]).join(', '), 'Erro de transmissão':r.x.erro?'Sim':'Não', 'Mensagem de erro':(r.x.erros||[]).join(' | '),
    'Publicado em outros canais':r.ocIds.map(i=>MPN[i]).join(', '), 'Concluída': (r.orfao ? S.acoes[acaoKey(r.sku,mp)]?.concluido : r.l && isDone(r.l,mp)) ? 'Sim' : 'Não' }));
  baixarXLSX('MATCON_'+MPN[mp].replace(/\s/g,''), rows, MPN[mp].slice(0,31));
}
function exportCat(){
  baixarXLSX('MATCON_Catalogo', catRows().map(r=>{ const l=r.l; const o={ 'SKU':r.sku,'Produto':r.name,'EAN':l?.ean||'','Marca':r.marca,'Departamento':r.dep,'Categoria':l?.categoria||'','Subcategoria':l?.subcategoria||'','Peso (kg)':r.peso,'Altura':l?.altura??null,'Largura':l?.largura??null,'Profundidade':l?.profundidade??null,'Preço De':r.pde,'Preço Por':r.ppor,'Estoque':r.stock,'Status no site':l?.status||'Fora da base' };
    for (const m of MARKETPLACES){ const x=r.mpx[m.id]; o[m.nome+' - cadastrado']=x.cad?'Sim':'Não'; o[m.nome+' - publicado']=x.publicado?'Sim':'Não'; o[m.nome+' - status']=x.cad?(x.pub||''):'Não cadastrado'; o[m.nome+' - erro']=x.erro?(x.erros||[]).join(' | ')||'Sim':''; o[m.nome+' - ação']=x.status?STATUS_LABEL[x.status]:''; }
    o['Elegível']=l?(l.elegivel?'Sim':'Não'):''; const {SKU,Produto,...resto}=o; return { SKU, Produto, 'Situação': r.mot||'Elegível', ...resto }; }), 'Catálogo');
}
function exportResumo(){
  const s=S.sum;
  baixarXLSX('MATCON_Resumo', [{Marketplace:'Flagship', Ativos:s.flagship}, ...MARKETPLACES.map(x=>{const r=s.mp[x.id];return {Marketplace:x.nome, Ativos:r.ativos, Inativar:r.Inativar, 'Preço diferente':r.Dif, 'Preço igual':r.Igual, Subir:r.Subir, Final:r.final, Pendentes:pendentes(x.id)}})], 'Resumo');
}

function openConfig(){
  const c=getConfig()||{};
  $('#modalHost').innerHTML = `<div class="overlay" onclick="if(event.target===this)this.remove()"><div class="modal">
    <h2>Conexão com o Supabase</h2><p>Project Settings › API. Fica salvo neste navegador. Para fixar para todos, preencha SUPABASE_URL e SUPABASE_ANON_KEY no topo do index.html.</p>
    <div class="fld"><label>Project URL</label><input id="cfgUrl" value="${esc(c.url||'')}" placeholder="https://xxxx.supabase.co" ${c.fixed?'disabled':''}></div>
    <div class="fld"><label>anon public key</label><input id="cfgKey" value="${esc(c.key||'')}" ${c.fixed?'disabled':''}></div>
    <div class="act">${!c.fixed&&c.url?'<button class="btn" onclick="localStorage.removeItem(\'matcon_sb\');location.reload()">Desconectar</button>':''}<button class="btn" onclick="this.closest('.overlay').remove()">Fechar</button>${c.fixed?'':'<button class="btn pri" onclick="saveConfig()">Salvar e conectar</button>'}</div>
  </div></div>`;
}
function saveConfig(){
  const url=$('#cfgUrl').value.trim().replace(/\/+$/,''), key=$('#cfgKey').value.replace(/\s+/g,'');
  if(!url||!key){ toast('Preencha URL e chave'); return; }
  localStorage.setItem('matcon_sb', JSON.stringify({url,key})); location.reload();
}

boot();
