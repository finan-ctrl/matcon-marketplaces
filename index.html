<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MATCON.casa · Gestão de Marketplaces</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23111'/><text x='16' y='22' font-family='Arial' font-weight='900' font-size='15' text-anchor='middle' fill='%2394BF26'>MC</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --brand:#94BF26; --brand-d:#6f9214; --brand-l:#eef5da;
  --ink:#111111; --ink-2:#52514e; --ink-3:#8a8984;
  --bg:#f4f5f1; --card:#ffffff; --line:#e6e6e1; --line-2:#f0f0ec;
  --st-inativar:#e34948; --st-dif:#eda100; --st-igual:#008300; --st-subir:#2a78d6; --st-none:#a3a29c;
  --radius:12px; --shadow:0 1px 2px rgba(17,17,17,.04),0 2px 8px rgba(17,17,17,.04);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,sans-serif;overflow-x:hidden}
h1,h2,h3{font-family:Montserrat,Inter,sans-serif;margin:0}
button,input,select{font:inherit}
.hidden{display:none!important}

/* ---------- header ---------- */
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.hbar{display:flex;align-items:center;gap:20px;padding:12px 24px;max-width:100%}
.hbar img{height:26px;display:block}
.hbar .tag{font:600 11px Inter;color:var(--ink-2);border-left:1px solid var(--line);padding-left:14px;text-transform:uppercase;letter-spacing:.08em}
.hbar .sp{flex:1}
.hbar .who{font-size:12px;color:var(--ink-2);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
nav{display:flex;gap:2px;padding:0 24px;flex-wrap:wrap}
nav button{background:none;border:0;padding:10px 14px 12px;color:var(--ink-2);font-weight:600;cursor:pointer;border-bottom:3px solid transparent}
nav button:hover{color:var(--ink)}
nav button.on{color:var(--ink);border-bottom-color:var(--brand)}
.banner{background:#fff8e1;border-bottom:1px solid #f1e2b0;color:#6b5300;padding:8px 24px;font-size:13px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}

main{padding:20px 24px 48px;max-width:1600px;margin:0 auto}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.page-h h1{font-size:22px;font-weight:800}
.page-h p{margin:4px 0 0;color:var(--ink-2);font-size:13px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:7px 12px;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#cfcfc8}
.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.pri:hover{background:#2a2a2a}
.btn.lime{background:var(--brand);border-color:var(--brand);color:#111}
.btn.sm{padding:5px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ---------- grid / cards ---------- */
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.span2{grid-column:span 2}
@media(max-width:1100px){.g4,.g5{grid-template-columns:repeat(2,minmax(0,1fr))}.g3,.g2{grid-template-columns:minmax(0,1fr)}.span2{grid-column:auto}}
@media(max-width:560px){.g4,.g5{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;min-width:0}
.card h3{font-size:14px;font-weight:700;margin-bottom:2px}
.card .sub{color:var(--ink-3);font-size:12px;margin-bottom:12px}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}

.kpi{position:relative;overflow:hidden}
.kpi .lb{font-size:12px;color:var(--ink-2);font-weight:600}
.kpi .v{font:800 28px/1.15 Montserrat;margin-top:6px;letter-spacing:-.01em}
.kpi .d{font-size:12px;color:var(--ink-3);margin-top:4px}
.kpi.accent::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--brand)}
.kpi.click{cursor:pointer;transition:border-color .15s}
.kpi.click:hover{border-color:#cfcfc8}
.kpi.sel{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.kpi .dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:0}

/* ---------- tables (sem rolagem lateral) ---------- */
.tbl{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13px}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-2);font-weight:700;text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;user-select:none}
.tbl th.s{cursor:pointer}
.tbl th.s:hover{color:var(--ink)}
.tbl td{padding:7px 8px;border-bottom:1px solid var(--line-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.tbl tr:hover td{background:#fafaf7}
.tbl .n{text-align:right;font-variant-numeric:tabular-nums}
.tbl .c{text-align:center}
.tbl tfoot td{font-weight:700;border-top:1px solid var(--line);border-bottom:0}
.tbl td.wrap{white-space:normal}
.tbl.hw th{white-space:normal;line-height:1.25;vertical-align:bottom}
@media(max-width:1280px){.tbl .hm{display:none}}
@media(max-width:900px){.tbl .hs{display:none}}
@media(max-width:640px){.tbl .hx{display:none}}
.lnk{color:inherit;text-decoration:underline dotted #b5b4ad;text-underline-offset:3px;cursor:pointer;border-radius:4px;padding:1px 3px;margin:-1px -3px}
.lnk:hover{color:var(--brand-d);text-decoration-color:var(--brand-d);background:var(--brand-l)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.muted{color:var(--ink-3)}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:#f1f1ed;color:var(--ink-2);max-width:100%;overflow:hidden;text-overflow:ellipsis}
.pill::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--st-none);flex:none}
.pill.Inativar{background:#fdeceb;color:#a32221}.pill.Inativar::before{background:var(--st-inativar)}
.pill.Dif{background:#fdf3dc;color:#7a5300}.pill.Dif::before{background:var(--st-dif)}
.pill.Igual{background:#e3f2e3;color:#005c00}.pill.Igual::before{background:var(--st-igual)}
.pill.Subir{background:#e3eefb;color:#1c4f8f}.pill.Subir::before{background:var(--st-subir)}
.pill.ok{background:var(--brand-l);color:#476000}.pill.ok::before{background:var(--brand)}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters input[type=search],.filters select{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff;min-width:0}
.filters input[type=search]{flex:1 1 220px}
.filters select{flex:0 1 200px}
.filters label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.pager{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12px;color:var(--ink-2);gap:8px;flex-wrap:wrap}
.pager .pg{display:flex;gap:4px;align-items:center}

.chart-box{position:relative;height:260px}
.chart-box.sm{height:200px}
.chart-box.lg{height:320px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-bottom:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.empty{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;color:var(--ink-3);text-align:center;padding:28px 12px;font-size:13px}
.empty b{color:var(--ink-2)}

/* bar list (motivos) */
.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:12.5px}
.bar-row .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.bar-row .tr{height:12px;background:var(--line-2);border-radius:4px;overflow:hidden}
.bar-row .fl{height:100%;background:var(--ink);border-radius:0 4px 4px 0}
.bar-row .vl{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}

/* upload */
.drop{border:2px dashed #cfd6bd;border-radius:var(--radius);background:#fbfcf6;padding:32px 16px;text-align:center;cursor:pointer;transition:.15s}
.drop:hover,.drop.over{border-color:var(--brand);background:var(--brand-l)}
.drop .big{font:700 16px Montserrat;margin-bottom:4px}
.progress{height:8px;background:var(--line-2);border-radius:99px;overflow:hidden;margin-top:10px}
.progress>div{height:100%;width:0;background:var(--brand);transition:width .2s}

/* premissas */
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.fld label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:4px}
.fld input,.fld select{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff}
.fld .hint{font-size:11px;color:var(--ink-3);margin-top:3px}
.tbl input.cell{width:100%;border:1px solid transparent;border-radius:6px;padding:4px 5px;text-align:right;background:#fafaf7;font-variant-numeric:tabular-nums;font-size:12px;min-width:0}
.tbl input.cell:focus{border-color:var(--brand);outline:none;background:#fff}
.tbl.dense td{padding:3px 3px}.tbl.dense th{padding:6px 3px;font-size:10px;white-space:normal;line-height:1.2}

/* modal / login / toast */
.overlay{position:fixed;inset:0;background:rgba(17,17,17,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:460px;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.modal h2{font-size:18px;margin-bottom:6px}
.modal p{color:var(--ink-2);font-size:13px;margin:0 0 16px}
.modal .fld{margin-bottom:12px}
.modal .act{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(135deg,#f4f5f1 0%,#eef5da 100%)}
.login .modal{max-width:380px}
.login img{height:34px;margin-bottom:18px}
.err{color:#a32221;font-size:12.5px;min-height:18px}
#toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:60;opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none;max-width:calc(100vw - 40px)}
#toast.on{opacity:1;transform:none}
.loading{position:fixed;inset:0;background:rgba(244,245,241,.85);display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;z-index:55;font-weight:600}
.spin{width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.chk{width:16px;height:16px;accent-color:var(--brand-d);cursor:pointer;margin:0}
.note{font-size:12px;color:var(--ink-2);background:var(--line-2);border-radius:8px;padding:10px 12px;line-height:1.5}
</style>
</head>

function mpFromAnymarket(nome){
  const n = String(nome||'').trim().toLowerCase();
  const m = MARKETPLACES.find(mp => mp.any.some(a => n.includes(a)));
  return m ? m.id : (n || 'outro');
}

/* ---------- normalização ---------- */
function num(v){
  if (v === null || v === undefined || v === '') return null;
  if (typeof v === 'number') return isFinite(v) ? v : null;
  let s = String(v).trim();
  if (!s) return null;
  if (s.includes(',')) s = s.replace(/\./g,'').replace(',','.'); // 1.234,56 (pt-BR)
  // sem vírgula: ponto é decimal (padrão do export: 0.650000)
  const n = parseFloat(s);
  return isFinite(n) ? n : null;
}
function txt(v){ return v===null||v===undefined ? '' : String(v).trim(); }
function decodeHtml(s){
  return String(s||'').replace(/&quot;/g,'"').replace(/&#0?39;/g,"'").replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>');
}
const r2 = v => Math.round(v*100)/100;

/* Peso: o export traz 6 casas decimais ("1.077000"); quando o Excel lê como milhar vira 1077000.
   Qualquer peso >= 1000 kg é tratado como escala x1.000.000. */
function corrigePeso(v){
  const n = num(v);
  if (n === null) return null;
  return n >= 1000 ? n / 1000000 : n;
}

/* Linha bruta da base (Produtos Base - BI) -> produto normalizado */
function normalizaProduto(row, P){
  const g = k => { for (const key of Object.keys(row)) if (key.trim().toLowerCase() === k) return row[key]; return null; };
  const preco = num(g('price')), esp = num(g('special_price')), est = num(g('stock_quantity'));
  return {
    sku: txt(g('sku')),
    name: decodeHtml(txt(g('name'))),
    ean: txt(g('ean')),
    marca: txt(g('marca')).toUpperCase(),
    departamento: txt(g('departamento')),
    categoria: txt(g('categoria')),
    subcategoria: txt(g('subcategoria')),
    inflamavel: txt(g('inflamavel')),
    altura: num(g('altura')),
    largura: num(g('largura')),
    profundidade: num(g('profundidade')),
    peso: corrigePeso(g('peso')),
    price: preco===null ? null : r2(preco / P.div_preco),
    special_price: esp===null ? null : r2(esp / P.div_preco),
    status: txt(g('status')),
    stock: est===null ? null : est / P.div_estoque,
    seller_id: txt(g('seller_id'))
  };
}

/* Linha do export Anymarket -> anúncio */
function normalizaAnuncio(row){
  const g = k => { for (const key of Object.keys(row)) if (key.trim().toUpperCase() === k) return row[key]; return null; };
  return {
    sku: txt(g('SKU INTERNO')),
    marketplace: txt(g('MARKETPLACE')),
    conta: txt(g('NOME DA CONTA')),
    sku_marketplace: txt(g('SKU NO MARKETPLACE')),
    cod_marketplace: txt(g('CÓD. MARKETPLACE')),
    preco_de: num(g('PREÇO DE')),
    preco_por: num(g('PREÇO POR')),
    custo: num(g('CUSTO')),
    calculo_preco: txt(g('CÁLCULO DE PREÇO')),
    tipo_listagem: txt(g('TIPO DE LISTAGEM')),
    titulo: decodeHtml(txt(g('TÍTULO DO PRODUTO')))
  };
}

/* ---------- regras ---------- */
/* Preço de venda no site = Preço Por (special_price); sem ele, Preço De (price) */
function precoRef(p){ return (p.special_price && p.special_price > 0) ? p.special_price : (p.price || 0); }

function elegibilidade(p, P){
  const motivos = [];
  if (txt(p.seller_id) !== txt(P.seller_id)) motivos.push('Outro seller');
  if (p.status.toLowerCase() !== 'habilitado') motivos.push('Desabilitado');
  if (p.inflamavel.toLowerCase() === 'sim') motivos.push('Inflamável');
  if (precoRef(p) <= 0) motivos.push('Sem preço');
  if ((p.peso||0) >= P.peso_max) motivos.push('Peso ≥ ' + P.peso_max + ' kg');
  if ([p.altura,p.largura,p.profundidade].some(d => (d||0) >= P.dim_max)) motivos.push('Dimensão ≥ ' + P.dim_max + ' cm');
  const incompleto = [p.peso,p.altura,p.largura,p.profundidade].some(v => v===null || v===0);
  if (incompleto && P.exigir_cadastro) motivos.push('Cadastro incompleto');
  return { elegivel: motivos.length === 0, motivos, incompleto };
}

function custoShopee(preco, P){
  const f = P.shopee.faixas.slice().sort((a,b)=>a.min-b.min);
  let t = f[0];
  for (const x of f) if (preco >= x.min) t = x;
  return { frete: null, fixo: t.fixo, com: t.com, pct: (t.com*preco + t.fixo)/preco };
}
function freteMeli(preco, peso, P){
  const M = P.meli;
  if ((peso||0) > M.faixas_peso[M.faixas_peso.length-1]) return null;
  let col = 0; for (const lim of M.faixas_preco) if (preco > lim) col++;
  let lin = M.faixas_peso.findIndex(l => (peso||0) <= l);
  if (lin < 0) return null;
  const v = (M.tabela[lin]||[])[col];
  return v==null ? null : r2(v * M.multiplicador);
}
function custoMeli(preco, peso, P){
  const frete = freteMeli(preco, peso, P);
  return { frete, fixo: 0, com: P.meli.com, pct: frete===null ? null : (P.meli.com*preco + frete)/preco };
}
function freteMagalu(peso, P){
  const M = P.magalu;
  const i = M.faixas_peso.findIndex(l => (peso||0) <= l);
  return i < 0 ? null : M.valores[i];
}
function custoMagalu(preco, peso, P){
  const frete = freteMagalu(peso, P);
  return { frete, fixo: 0, com: P.magalu.com, pct: frete===null ? null : (P.magalu.com*preco + frete)/preco };
}

function statusMP(eleg, ativo, pct, preco, P){
  const temAtivo = ativo !== null && ativo > 0;
  if (!eleg && temAtivo) return 'Inativar';
  if (temAtivo && pct !== null && pct > P.comissao_max) return 'Inativar';
  if (temAtivo && r2(ativo) !== r2(preco)) return 'Dif';
  if (temAtivo) return 'Igual';
  if (eleg && pct !== null && pct <= P.comissao_max) return 'Subir';
  return '';
}

/* ---------- cálculo completo ---------- */
function calcula(produtos, anuncios, P){
  // preço ativo por SKU/marketplace (menor PREÇO POR quando houver duplicidade)
  const ativos = {}; const outros = {};
  for (const a of anuncios){
    const mp = mpFromAnymarket(a.marketplace);
    const preco = a.preco_por ?? a.preco_de;
    if (!MARKETPLACES.some(m=>m.id===mp)) { (outros[a.marketplace] ||= new Set()).add(a.sku); continue; }
    const key = mp + '|' + a.sku;
    if (!(key in ativos) || (preco !== null && preco < ativos[key])) ativos[key] = preco;
  }
  const catalogo = new Map();
  const linhas = [];
  for (const p of produtos){
    if (!p.sku) continue;
    if (txt(p.seller_id) !== txt(P.seller_id)) continue; // universo = Flagship
    catalogo.set(p.sku, true);
    const e = elegibilidade(p, P);
    const preco = precoRef(p);
    const L = { ...p, preco_ref: preco, elegivel: e.elegivel, motivos: e.motivos, incompleto: e.incompleto, mp: {} };
    const custos = {
      shopee: e.elegivel ? custoShopee(preco, P) : null,
      meli:   e.elegivel ? custoMeli(preco, p.peso, P) : null,
      magalu: e.elegivel ? custoMagalu(preco, p.peso, P) : null
    };
    for (const m of MARKETPLACES){
      const c = custos[m.id];
      const ativo = ativos[m.id+'|'+p.sku] ?? null;
      L.mp[m.id] = {
        ativo, frete: c?c.frete:null, com: c?c.com:null, fixo: c?c.fixo:null, pct: c?c.pct:null,
        comissao: c ? r2(c.com * preco) : null,
        status: statusMP(e.elegivel, ativo, c?c.pct:null, preco, P)
      };
    }
    linhas.push(L);
  }
  // anúncios cujo SKU não está no catálogo Flagship => Inativar
  const orfaos = {};
  for (const key of Object.keys(ativos)){
    const [mp, sku] = key.split('|');
    if (!catalogo.has(sku)) (orfaos[mp] ||= []).push({ sku, ativo: ativos[key] });
  }
  return { linhas, orfaos, outros };
}

function resumo(res){
  const flag = res.linhas.filter(l => l.status.toLowerCase()==='habilitado').length;
  const out = { flagship: flag, total: res.linhas.length, elegiveis: res.linhas.filter(l=>l.elegivel).length, mp: {} };
  for (const m of MARKETPLACES){
    const r = { ativos:0, Inativar:0, Dif:0, Igual:0, Subir:0, orfaos: (res.orfaos[m.id]||[]).length };
    for (const l of res.linhas){
      const s = l.mp[m.id];
      if (s.ativo !== null && s.ativo > 0) r.ativos++;
      if (s.status) r[s.status]++;
    }
    r.ativos += r.orfaos; r.Inativar += r.orfaos;
    r.final = r.Igual + r.Subir;
    out.mp[m.id] = r;
  }
  out.outros = Object.fromEntries(Object.entries(res.outros).map(([k,v])=>[k, v.size]));
  return out;
}

if (typeof module !== 'undefined') module.exports = { DEFAULT_PREMISSAS, MARKETPLACES, STATUS, STATUS_LABEL, normalizaProduto, normalizaAnuncio, calcula, resumo, mpFromAnymarket, elegibilidade, custoShopee, custoMeli, custoMagalu, precoRef };

</script>

/* ============================ SUPABASE ============================ */
function getConfig(){

}

async function fetchAll(table, order){
  const out=[]; const step=1000; let from=0;
  while(true){
    const { data, error } = await S.sb.from(table).select('*').order(order).range(from, from+step-1);
    if (error) throw error;
    out.push(...data);
    if (data.length < step) break;
    from += step;
    loading(true, `Carregando ${table.replace('mc_','')}… ${fN(out.length)}`);
  }
  return out;
}
async function loadAll(){
  try{
    loading(true,'Carregando dados…');
    const [prem, produtos, anuncios, acoes, snaps, cargas] = await Promise.all([
      S.sb.from('mc_premissas').select('*').eq('id',1).maybeSingle(),
      fetchAll('mc_produtos','sku'),
      fetchAll('mc_anuncios','id'),
      fetchAll('mc_acoes','sku'),
      S.sb.from('mc_snapshots').select('*').order('criado_em',{ascending:false}).limit(90),
      S.sb.from('mc_cargas').select('*').order('criado_em',{ascending:false}).limit(40)
    ]);
    if (prem.data?.dados) S.P = mergeP(prem.data.dados);
    S.produtos = produtos.map(p => ({...p, name:p.name||'', marca:p.marca||'', departamento:p.departamento||'', status:p.status||'', inflamavel:p.inflamavel||'', seller_id:String(p.seller_id??'')}));
    S.anuncios = anuncios;
    S.acoes = Object.fromEntries(acoes.map(a=>[acaoKey(a.sku,a.marketplace), a]));
    S.snapshots = (snaps.data||[]).reverse();
    S.cargas = cargas.data||[];
    recalc(); render();
  } catch(e){ console.error(e); toast('Erro ao carregar: ' + (e.message||e), 6000); }
  finally{ loading(false); }
}
function mergeP(d){
  const P = structuredClone(DEFAULT_PREMISSAS);
  for (const k of Object.keys(d)) if (d[k] && typeof d[k]==='object' && !Array.isArray(d[k])) P[k] = {...P[k], ...d[k]}; else P[k] = d[k];
  return P;
}

/* ============================ CÁLCULO ============================ */
function recalc(){

}

/* ---------- Chart.js padrão ---------- */

Chart.defaults.color = '#52514e';

const gridC = '#efefea';
function legendHTML(items){ return `<div class="legend">${items.map(([n,c])=>`<span><i style="background:${c}"></i>${esc(n)}</span>`).join('')}</div>`; }

/* ======================= VISÃO GERAL ======================= */
function renderGeral(){

          ${MARKETPLACES.map(x=>{const r=s.mp[x.id], L=(v,st,t,pend)=>lk(v,`abrirLista('${x.id}','${st}',${!!pend})`,`${x.nome} · ${t}`);return `<tr><td>${lk('<b>'+x.nome+'</b>',`abrirLista('${x.id}','acoes')`,'Ver todas as ações '+x.nome)}</td><td class="n">${L(fN(r.ativos),'ativos','Ativos')}</td><td class="n">${L(fN(r.Inativar),'Inativar','Inativar')}</td><td class="n">${L(fN(r.Dif),'Dif','Preço diferente')}</td><td class="n">${L(fN(r.Igual),'Igual','Preço igual')}</td><td class="n">${L(fN(r.Subir),'Subir','Subir')}</td><td class="n"><b>${L(fN(r.final),'final','Final (igual + subir)')}</b></td><td class="n hs">${L(fN(pendentes(x.id)),'acoes','Pendentes',true)}</td></tr>`}).join('')}
          ${Object.entries(s.outros).map(([k,v])=>`<tr><td>${esc(k)} <span class="muted">· sem regras</span></td><td class="n">${lk(fN(v),`abrirOutros('${esc(k).replace(/'/g,"\\'")}')`,'Ver anúncios '+esc(k))}</td><td class="n muted" colspan="6" style="text-align:left">Cadastre as regras em Premissas para analisar</td></tr>`).join('')}
        </tbody>

    </div>
    <div class="card">
      <h3>Status dos SKUs por marketplace</h3><div class="sub">Clique em uma barra para abrir a lista</div>
      ${legendHTML(STATUS.map(x=>[STATUS_LABEL[x],ST_COLOR[x]]))}
      <div class="chart-box sm"><canvas id="chStatus"></canvas></div>
    </div>
  </div>
  <div class="grid g2">
    <div class="card">
      <h3>Por que um SKU não é elegível</h3><div class="sub">SKUs do seller fora das premissas (um SKU pode ter mais de um motivo)</div>
      <div class="bars" id="motivos"></div>
    </div>
    <div class="card">
      <div class="card-h"><div><h3>Evolução</h3><div class="sub">Fotografias registradas a cada carga</div></div>
      <select id="evoMetric" class="btn sm" onchange="drawEvo()"><option value="final">Final projetado</option><option value="ativos">Ativos</option><option value="pend">Ações (inativar + dif. + subir)</option></select></div>
      <div id="evoWrap"></div>
    </div>
  </div>`;
  // status chart
  S.charts.status = new Chart($('#chStatus'), {
    type:'bar',
    data:{ labels:MARKETPLACES.map(x=>x.nome), datasets: STATUS.map(st=>({ label:STATUS_LABEL[st], data:MARKETPLACES.map(x=>s.mp[x.id][st]), backgroundColor:ST_COLOR[st], borderColor:'#fff', borderWidth:{left:1,right:1}, borderSkipped:false, barThickness:22 })) },
    options:{ indexAxis:'y', maintainAspectRatio:false, scales:{ x:{stacked:true, grid:{color:gridC}, border:{display:false}}, y:{stacked:true, grid:{display:false}, border:{display:false}} },
      onClick:(e,els)=>{ if(els.length){ const mp=MARKETPLACES[els[0].index].id, st=STATUS[els[0].datasetIndex]; setTimeout(()=>abrirLista(mp,st),0); } },
      onHover:(e,els)=>{ e.native.target.style.cursor = els.length ? 'pointer' : 'default'; },
      plugins:{ tooltip:{ callbacks:{ label:c=>` ${c.dataset.label}: ${fN(c.raw)}`, footer:()=>'Clique para abrir a lista' } } } }
  });
  // motivos
  const mot={}; S.res.linhas.forEach(l=>l.motivos.forEach(x=>{ if(x!=='Outro seller') mot[x]=(mot[x]||0)+1; }));
  const inc = S.res.linhas.filter(l=>l.incompleto && !l.motivos.includes('Cadastro incompleto')).length;
  const arr = Object.entries(mot).sort((a,b)=>b[1]-a[1]); const max = Math.max(1,...arr.map(a=>a[1]));

function renderMP(mp){

  const card = (st, lb, v, d) => `<div class="card kpi click ${f.st===st?'sel':''}" onclick="setMPf('${mp}','st','${st}')"><div class="lb">${st in ST_COLOR?`<span class="dot" style="background:${ST_COLOR[st]}"></span>`:''}${lb}</div><div class="v">${v}</div><div class="d">${d}</div></div>`;

  <div class="grid g5" style="margin-bottom:16px">
    ${card('ativos','Ativos', fN(r.ativos), 'Final projetado: '+fN(r.final))}
    ${card('Inativar','Inativar', fN(r.Inativar), fN(pend('Inativar')+(S.res.orfaos[mp]||[]).length)+' pendentes')}
    ${card('Dif','Preço diferente', fN(r.Dif), fN(pend('Dif'))+' pendentes')}
    ${card('Igual','Preço igual', fN(r.Igual), 'Ativos e alinhados ao site')}

  </div>
  <div class="grid g2" style="margin-bottom:16px">
    <div class="card"><h3>Comissão estimada dos SKUs elegíveis</h3><div class="sub">(comissão + ${mp==='shopee'?'fixo':'frete'}) ÷ Preço Por · barras cinza passam de ${fP(S.P.comissao_max,0)} e ficam de fora</div><div class="chart-box sm"><canvas id="chHist"></canvas></div></div>
    <div class="card"><h3>Onde estão as ações</h3><div class="sub">Top departamentos por quantidade de SKUs em cada ação</div>${legendHTML(['Inativar','Dif','Subir'].map(x=>[STATUS_LABEL[x],ST_COLOR[x]]))}<div class="chart-box sm"><canvas id="chDep"></canvas></div></div>
  </div>

    <div class="filters">
      <input type="search" id="fq" placeholder="Buscar SKU, produto, marca ou EAN" value="${esc(f.q)}">

      <select id="fdep"><option value="">Todos os departamentos</option>${S.deps.map(d=>`<option ${f.dep===d?'selected':''}>${esc(d)}</option>`).join('')}</select>

}
function setMPf(mp,k,v){ const f=S.f[mp]; f[k] = (k==='st' && f.st===v) ? 'acoes' : v; f.page=0; renderMP(mp); }
function drawMPCharts(mp){
  // histograma
  const bins=[0,.05,.10,.15,.20,.25,.30,.35,.40,.50]; const lab=[], cnt=[];
  for (let i=0;i<bins.length;i++){ lab.push(i<bins.length-1 ? `${bins[i]*100}–${bins[i+1]*100}%` : `≥ ${bins[i]*100}%`); cnt.push(0); }
  S.res.linhas.forEach(l=>{ const p=l.mp[mp].pct; if(!l.elegivel||p==null) return; let i=bins.length-1; for(let k=0;k<bins.length-1;k++) if(p<bins[k+1]){i=k;break;} cnt[i]++; });
  const lim=S.P.comissao_max;
  S.charts.hist = new Chart($('#chHist'), { type:'bar',
    data:{ labels:lab, datasets:[{ data:cnt, backgroundColor:bins.map(b=>b<lim-1e-9?'#94BF26':'#cfcfc8'), borderRadius:{topLeft:4,topRight:4}, borderSkipped:'bottom', maxBarThickness:34 }] },
    options:{ maintainAspectRatio:false, scales:{ x:{grid:{display:false}}, y:{grid:{color:gridC}, border:{display:false}} }, plugins:{ tooltip:{ callbacks:{ label:c=>` ${fN(c.raw)} SKUs elegíveis` } } } } });
  // departamentos
  const dep={}; S.res.linhas.forEach(l=>{ const s=l.mp[mp].status; if(!isAcao(s)) return; const d=l.departamento||'(sem departamento)'; (dep[d] ||= {Inativar:0,Dif:0,Subir:0,t:0}); dep[d][s]++; dep[d].t++; });
  const top = Object.entries(dep).sort((a,b)=>b[1].t-a[1].t).slice(0,8);
  S.charts.dep = new Chart($('#chDep'), { type:'bar',
    data:{ labels:top.map(t=>t[0]), datasets:['Inativar','Dif','Subir'].map(st=>({ label:STATUS_LABEL[st], data:top.map(t=>t[1][st]), backgroundColor:ST_COLOR[st], borderColor:'#fff', borderWidth:{left:1,right:1}, borderSkipped:false, barThickness:14 })) },
    options:{ indexAxis:'y', maintainAspectRatio:false, scales:{ x:{stacked:true,grid:{color:gridC},border:{display:false}}, y:{stacked:true,grid:{display:false},border:{display:false},ticks:{crossAlign:'far',autoSkip:false}} },
      plugins:{ tooltip:{ mode:'index', callbacks:{ title:i=>top[i[0].dataIndex][0], label:c=>` ${c.dataset.label}: ${fN(c.raw)}` } } } } });
}
function mpRows(mp){
  const f=S.f[mp]; const q=f.q.trim().toLowerCase();
  let rows = S.res.linhas.filter(l=>{
    const x=l.mp[mp], s=x.status;
    if (f.st==='acoes' && !isAcao(s)) return false;
    if (f.st==='ativos' && !(x.ativo>0)) return false;
    if (STATUS.includes(f.st) && s!==f.st) return false;
    if (f.st==='inviavel' && !(l.elegivel && !s)) return false;
    if (f.st==='final' && s!=='Igual' && s!=='Subir') return false;
    if (f.dep && l.departamento!==f.dep) return false;
    if (f.pend && (!isAcao(s) || isDone(l,mp))) return false;
    if (q && !(l.sku.toLowerCase().includes(q) || l.name.toLowerCase().includes(q) || l.marca.toLowerCase().includes(q) || (l.ean||'').includes(q))) return false;
    return true;
  }).map(l=>({ l, sku:l.sku, name:l.name, dep:l.departamento, stock:l.stock, pde:l.price, ppor:l.preco_ref, ativo:l.mp[mp].ativo, frete:l.mp[mp].frete ?? l.mp[mp].fixo, comissao: mp==='shopee' ? l.mp[mp].com : l.mp[mp].comissao, pct:l.mp[mp].pct, st:statusLabel(l,mp), orfao:false }));
  // anúncios sem SKU no catálogo flagship
  if (['acoes','ativos','Inativar','todos'].includes(f.st) && !f.dep){
    (S.res.orfaos[mp]||[]).forEach(o=>{
      if (f.pend && S.acoes[acaoKey(o.sku,mp)]?.concluido) return;
      if (q && !o.sku.toLowerCase().includes(q)) return;
      rows.push({ l:null, sku:o.sku, name:'(SKU fora do catálogo Flagship)', dep:'', stock:null, pde:null, ppor:null, ativo:o.ativo, frete:null, comissao:null, pct:null, st:'Inativar', orfao:true });
    });
  }
  return rows;
}
function drawMPTable(mp){
  const f=S.f[mp]; const rows=mpRows(mp);
  const cols = [
    {k:'chk', t:'✓', w:'34px', c:'c', ns:true},
    {k:'sku', t:'SKU', w:'7.5%'},

    {k:'ativo', t:'Preço Canal', w:'8%', n:1},
    {k:'frete', t:mp==='shopee'?'Fixo':'Frete', w:'7%', n:1, cls:'hs'},
    {k:'comissao', t: mp==='shopee' ? 'Comissão % (faixa)' : 'Comissão ('+fP(S.P[mp].com,1)+')', w:'8%', n:1, cls:'hx'},
    {k:'pct', t:'Comissão Estimada %', w:'8.5%', n:1},
    {k:'st', t:'Ação', w:'11%'}
  ];
  rows.sort((a,b)=>{ const x=a[f.sort], y=b[f.sort]; if(x==null&&y==null) return 0; if(x==null) return 1; if(y==null) return -1; return (typeof x==='string' ? x.localeCompare(y,'pt-BR') : x-y) * f.dir; });
  const per=50, pages=Math.max(1,Math.ceil(rows.length/per)); f.page=Math.min(f.page,pages-1);
  const pg=rows.slice(f.page*per, f.page*per+per);
  $('#mpTable').innerHTML = `<table class="tbl hw"><colgroup>${cols.map(c=>`<col class="${c.cls||''}" style="width:${c.w}">`).join('')}</colgroup>
  <thead><tr>${cols.map(c=>`<th class="${c.ns?'':'s'} ${c.n?'n':''} ${c.c||''} ${c.cls||''}" data-k="${c.k}">${c.t}${f.sort===c.k?(f.dir>0?' ↑':' ↓'):''}</th>`).join('')}</tr></thead>
  <tbody>${pg.map(r=>{
    const s = r.orfao ? 'Inativar' : r.l.mp[mp].status;
    const done = r.orfao ? !!S.acoes[acaoKey(r.sku,mp)]?.concluido : isDone(r.l,mp);
    const chk = isAcao(s) ? `<input type="checkbox" class="chk" ${done?'checked':''} onchange="toggleAcao('${mp}','${esc(r.sku)}','${s}',this.checked)" title="Marcar ação como concluída">` : '';
    const dif = r.ativo!=null && r.ppor!=null && Math.round(r.ativo*100)!==Math.round(r.ppor*100);
    return `<tr style="${done?'opacity:.55':''}"><td class="c">${chk}</td><td class="mono" title="${esc(r.sku)}">${esc(r.sku)}</td><td title="${esc(r.name)}">${esc(r.name)}</td><td class="hm" title="${esc(r.dep)}">${esc(r.dep)}</td><td class="n hs">${fN(r.stock)}</td><td class="n hx">${fR(r.pde)}</td><td class="n">${fR(r.ppor)}</td><td class="n" style="${dif?'color:#7a5300;font-weight:600':''}">${fR(r.ativo)}</td><td class="n hs">${fR(r.frete)}</td><td class="n hx" title="${r.l?fP(r.l.mp[mp].com,1)+' × Preço Por = '+fR(r.l.mp[mp].comissao):''}">${mp==='shopee' ? fP(r.comissao,1) : fR(r.comissao)}</td><td class="n" style="${r.pct>S.P.comissao_max?'color:#a32221':''}">${fP(r.pct)}</td><td><span class="pill ${s}">${esc(r.st)}</span></td></tr>`;
  }).join('') || `<tr><td colspan="${cols.length}"><div class="empty">Nenhum SKU com esses filtros.</div></td></tr>`}</tbody></table>
  ${pagerHTML(rows.length, f.page, pages, `pgMP('${mp}',`)}`;
  const stTxt = { acoes:'Todas as ações', ativos:'Ativos', Inativar:'Inativar', Dif:'Preço diferente', Igual:'Preço igual', Subir:'Subir', final:'Final (igual + subir)', inviavel:'Inviável (comissão alta)', todos:'Todos os SKUs' }[f.st];
  $('#mpListTit').textContent = `${MPN[mp]} · ${stTxt}${f.pend?' · só pendentes':''}${f.dep?' · '+f.dep:''} — ${fN(rows.length)} SKUs`;
  $('#mpTable').querySelectorAll('th.s').forEach(th=>th.onclick=()=>{ const k=th.dataset.k; if(f.sort===k) f.dir*=-1; else { f.sort=k; f.dir=1; } drawMPTable(mp); });
}
function pagerHTML(total, page, pages, fn){
  return `<div class="pager"><span>${fN(total)} SKUs · página ${page+1} de ${pages}</span><span class="pg">
  <button class="btn sm" ${page===0?'disabled':''} onclick="${fn}0)">«</button>
  <button class="btn sm" ${page===0?'disabled':''} onclick="${fn}${page-1})">‹ Anterior</button>
  <button class="btn sm" ${page>=pages-1?'disabled':''} onclick="${fn}${page+1})">Próxima ›</button>

function pgMP(mp,p){ S.f[mp].page=p; drawMPTable(mp); }

async function toggleAcao(mp, sku, acao, on){
  const k=acaoKey(sku,mp);
  const rec = { sku, marketplace:mp, acao, concluido:on, usuario:S.user?.email||null, atualizado_em:new Date().toISOString() };
  if (on) S.acoes[k]=rec; else delete S.acoes[k];
  if (!S.local){
    const q = on ? S.sb.from('mc_acoes').upsert(rec) : S.sb.from('mc_acoes').delete().eq('sku',sku).eq('marketplace',mp);
    const { error } = await q;
    if (error){ toast('Erro ao salvar: '+error.message,5000); return; }
  }
  drawMPTable(mp);
  toast(on ? 'Ação marcada como concluída' : 'Ação reaberta');
}

    if (f.el==='s' && !l.elegivel) return false;
    if (f.el==='n' && l.elegivel) return false;
    if (f.el==='i' && !l.incompleto) return false;
    if (f.el==='h' && l.status.toLowerCase()!=='habilitado') return false;
    if (f.mot && !l.motivos.includes(f.mot)) return false;
    if (f.dep && l.departamento!==f.dep) return false;
    if (q && !(l.sku.toLowerCase().includes(q)||l.name.toLowerCase().includes(q)||l.marca.toLowerCase().includes(q)||(l.ean||'').includes(q))) return false;
    return true;
  }).map(l=>({l, sku:l.sku, name:l.name, marca:l.marca, dep:l.departamento, peso:l.peso, dim:Math.max(l.altura||0,l.largura||0,l.profundidade||0)||null, pde:l.price, ppor:l.preco_ref, stock:l.stock, mot:l.elegivel?'':l.motivos.join(' · ')}));
}

async function lerArquivo(file){
  const st=$('#upStatus');
  st.innerHTML = `<div class="muted">Lendo ${esc(file.name)}…</div>`;
  await new Promise(r=>setTimeout(r,30));
  try{
    const buf = await file.arrayBuffer();
    const isCsv = /\.csv$/i.test(file.name);
    const wb = XLSX.read(buf, { type:'array', raw:isCsv, codepage:65001 });
    let base=null, anym=null;
    for (const name of wb.SheetNames){
      const aoa = XLSX.utils.sheet_to_json(wb.Sheets[name], { header:1, defval:null, raw:true, blankrows:false });
      for (let i=0;i<Math.min(10,aoa.length);i++){
        const h=(aoa[i]||[]).map(x=>String(x??'').trim().toLowerCase());
        const toObjs = () => { const hdr=aoa[i].map(x=>String(x??'').trim()); return aoa.slice(i+1).map(r=>{ const o={}; hdr.forEach((k,j)=>{ if(k) o[k]=r[j]; }); return o; }); };
        if (!base && h.includes('sku') && h.includes('seller_id') && h.includes('price')){ base={ sheet:name, rows:toObjs() }; break; }
        if (!anym && h.includes('sku interno') && h.includes('marketplace')){ anym={ sheet:name, rows:toObjs() }; break; }
      }
    }
    if (!base && !anym){ st.innerHTML = `<div class="err">Não encontrei a base de produtos nem o export do Anymarket neste arquivo. Confira os cabeçalhos.</div>`; return; }
    const produtos = base ? base.rows.map(r=>normalizaProduto(r,S.P)).filter(p=>p.sku) : null;
    const anuncios = anym ? anym.rows.map(normalizaAnuncio).filter(a=>a.sku) : null;
    const porMp = {}; (anuncios||[]).forEach(a=>porMp[a.marketplace]=(porMp[a.marketplace]||0)+1);
    const sellers = produtos ? produtos.filter(p=>p.seller_id===String(S.P.seller_id)).length : 0;
    st.innerHTML = `<div class="note">
      ${produtos?`<div>✔ <b>Base de produtos</b> (aba “${esc(base.sheet)}”): ${fN(produtos.length)} SKUs, ${fN(sellers)} do seller ${esc(S.P.seller_id)}.</div>`:''}
      ${anuncios?`<div>✔ <b>Anymarket</b> (aba “${esc(anym.sheet)}”): ${fN(anuncios.length)} anúncios — ${Object.entries(porMp).map(([k,v])=>esc(k)+' '+fN(v)).join(' · ')}.</div>`:''}
      <div style="margin-top:6px">${S.local?'Os dados vão ficar só nesta aba (modo local).':'Os dados atuais serão substituídos no Supabase.'}</div></div>
      <div style="display:flex;gap:8px;margin-top:10px"><button class="btn lime" id="btnConf">Confirmar carga</button><button class="btn" onclick="$('#upStatus').innerHTML=''">Cancelar</button></div>
      <div class="progress hidden" id="prog"><div></div></div><div class="muted" id="progMsg" style="font-size:12px;margin-top:4px"></div>`;
    $('#btnConf').onclick = () => gravarCarga(file.name, produtos, anuncios);
  } catch(e){ console.error(e); st.innerHTML = `<div class="err">Erro ao ler o arquivo: ${esc(e.message||e)}</div>`; }
}
function prog(p, msg){ const b=$('#prog'); if(!b) return; b.classList.remove('hidden'); b.firstElementChild.style.width=(p*100).toFixed(0)+'%'; $('#progMsg').textContent=msg||''; }

async function gravarCarga(arquivo, produtos, anuncios){
  $('#btnConf').disabled=true;
  try{
    if (S.local){
      if (produtos) S.produtos=produtos;
      if (anuncios) S.anuncios=anuncios;
      const now=new Date().toISOString();
      if (produtos) S.cargas.unshift({tipo:'base',arquivo,linhas:produtos.length,criado_em:now});
      if (anuncios) S.cargas.unshift({tipo:'anymarket',arquivo,linhas:anuncios.length,criado_em:now});
      recalc(); S.snapshots.push({criado_em:now, resumo:S.sum});
      toast('Carga aplicada (modo local)'); goTab('geral'); return;
    }
    const steps = (produtos?produtos.length:0) + (anuncios?anuncios.length:0); let done=0; const CH=1000;
    const who = S.user?.email||null;
    if (produtos){
      const { data:c, error:e1 } = await S.sb.from('mc_cargas').insert({ tipo:'base', arquivo, linhas:produtos.length, usuario:who }).select().single();
      if (e1) throw e1;
      // remove SKUs duplicados (fica a última ocorrência)
      const uniq = [...new Map(produtos.map(p=>[p.sku,p])).values()];
      for (let i=0;i<uniq.length;i+=CH){
        const chunk = uniq.slice(i,i+CH).map(p=>({...p, carga_id:c.id, atualizado_em:new Date().toISOString()}));
        const { error } = await S.sb.from('mc_produtos').upsert(chunk, { onConflict:'sku' });
        if (error) throw error;
        done += chunk.length; prog(done/steps, `Gravando produtos… ${fN(i+chunk.length)} de ${fN(uniq.length)}`);
      }
      const { error:e2 } = await S.sb.from('mc_produtos').delete().or(`carga_id.neq.${c.id},carga_id.is.null`);
      if (e2) throw e2;
    }
    if (anuncios){
      const { data:c, error:e1 } = await S.sb.from('mc_cargas').insert({ tipo:'anymarket', arquivo, linhas:anuncios.length, usuario:who }).select().single();
      if (e1) throw e1;
      for (let i=0;i<anuncios.length;i+=CH){
        const chunk = anuncios.slice(i,i+CH).map(a=>({...a, carga_id:c.id}));
        const { error } = await S.sb.from('mc_anuncios').insert(chunk);
        if (error) throw error;
        done += chunk.length; prog(done/steps, `Gravando anúncios… ${fN(i+chunk.length)} de ${fN(anuncios.length)}`);
      }
      const { error:e2 } = await S.sb.from('mc_anuncios').delete().neq('carga_id', c.id);
      if (e2) throw e2;
    }
    prog(1,'Recalculando…');
    await loadAll();
    await registrarSnapshot(true);
    toast('Carga gravada no Supabase'); goTab('geral');
  } catch(e){ console.error(e); toast('Erro na carga: '+(e.message||e), 7000); const b=$('#btnConf'); if(b) b.disabled=false; }
}
async function registrarSnapshot(silent){
  if (!S.res.linhas.length){ toast('Carregue a base antes'); return; }
  const snap = { resumo:S.sum, usuario:S.user?.email||null, criado_em:new Date().toISOString() };
  if (!S.local){ const { error } = await S.sb.from('mc_snapshots').insert({ resumo:snap.resumo, usuario:snap.usuario }); if (error){ toast('Erro: '+error.message); return; } }
  S.snapshots.push(snap);
  if (!silent) toast('Fotografia registrada');
}

/* ======================= EXPORTS ======================= */
function baixarXLSX(nome, rows, sheet='Dados'){
  const ws=XLSX.utils.json_to_sheet(rows); const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,sheet);
  XLSX.writeFile(wb, nome + '_' + new Date().toISOString().slice(0,10) + '.xlsx');
}
function exportMP(mp){
  const rows=mpRows(mp).map(r=>({ 'SKU':r.sku, 'Produto':r.name, 'EAN':r.l?.ean||'', 'Marca':r.l?.marca||'', 'Departamento':r.dep, 'Estoque':r.stock, 'Peso (kg)':r.l?.peso??null, 'Preço De':r.pde, 'Preço Por':r.ppor, 'Preço Canal':r.ativo, [mp==='shopee'?'Fixo':'Frete']:r.frete, 'Comissão %':r.l?.mp[mp].com??null, 'Comissão (R$)':r.l?.mp[mp].comissao??null, 'Comissão Estimada %':r.pct==null?null:Math.round(r.pct*10000)/10000, 'Ação':r.st, 'Concluída': (r.orfao ? S.acoes[acaoKey(r.sku,mp)]?.concluido : r.l && isDone(r.l,mp)) ? 'Sim' : 'Não' }));
  baixarXLSX('MATCON_'+MPN[mp].replace(/\s/g,''), rows, MPN[mp]);
}
function exportCat(){
  baixarXLSX('MATCON_Catalogo', catRows().map(r=>({ 'SKU':r.sku,'Produto':r.name,'EAN':r.l.ean,'Marca':r.marca,'Departamento':r.dep,'Categoria':r.l.categoria,'Subcategoria':r.l.subcategoria,'Peso (kg)':r.peso,'Altura':r.l.altura,'Largura':r.l.largura,'Profundidade':r.l.profundidade,'Preço De':r.pde,'Preço Por':r.ppor,'Estoque':r.stock,'Status':r.l.status,'Elegível':r.l.elegivel?'Sim':'Não','Motivos':r.mot })), 'Catálogo');
}
function exportResumo(){
  const s=S.sum;
  baixarXLSX('MATCON_Resumo', [{Marketplace:'Flagship', Ativos:s.flagship}, ...MARKETPLACES.map(x=>{const r=s.mp[x.id];return {Marketplace:x.nome, Ativos:r.ativos, Inativar:r.Inativar, 'Preço diferente':r.Dif, 'Preço igual':r.Igual, Subir:r.Subir, Final:r.final, Pendentes:pendentes(x.id)}})], 'Resumo');
}

/* ======================= CONFIG ======================= */
function openConfig(){
  const c=getConfig()||{};
  $('#modalHost').innerHTML = `<div class="overlay" onclick="if(event.target===this)this.remove()"><div class="modal">
    <h2>Conexão com o Supabase</h2><p>Project Settings › API. Fica salvo neste navegador. Para fixar para todos, preencha SUPABASE_URL e SUPABASE_ANON_KEY no topo do index.html.</p>
    <div class="fld"><label>Project URL</label><input id="cfgUrl" value="${esc(c.url||'')}" placeholder="https://xxxx.supabase.co" ${c.fixed?'disabled':''}></div>
    <div class="fld"><label>anon public key</label><input id="cfgKey" value="${esc(c.key||'')}" ${c.fixed?'disabled':''}></div>
    <div class="act">${!c.fixed&&c.url?'<button class="btn" onclick="localStorage.removeItem(\'matcon_sb\');location.reload()">Desconectar</button>':''}<button class="btn" onclick="this.closest('.overlay').remove()">Fechar</button>${c.fixed?'':'<button class="btn pri" onclick="saveConfig()">Salvar e conectar</button>'}</div>
  </div></div>`;
}
function saveConfig(){
  const url=$('#cfgUrl').value.trim().replace(/\/+$/,''), key=$('#cfgKey').value.replace(/\s+/g,'');
  if(!url||!key){ toast('Preencha URL e chave'); return; }
  localStorage.setItem('matcon_sb', JSON.stringify({url,key})); location.reload();
}

boot();
</script>
